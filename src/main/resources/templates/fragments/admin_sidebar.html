<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<body>
<aside class="main-sidebar sidebar-dark-primary elevation-4" th:fragment="adminSidebar">
    <!-- Brand Logo -->
    <a th:href="@{/admin/product/list}" class="brand-link">
        <span class="brand-text font-weight-light">Rêve</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
        <!-- Sidebar user panel (optional) -->
        <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="image">
                <img th:src="@{/dist/img/logo.png}" class="img-circle elevation-2" alt="User Image">
            </div>
            <div class="info">
                <a th:href="@{/mypage}" class="d-block" sec:authentication="name">Alexander Pierce</a>
            </div>
        </div>

        <!-- Sidebar Menu -->
        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
                <!-- Add icons to the links using the .nav-icon class
                     with font-awesome or any other icon font library -->
                <li class="nav-item">
                    <a th:href="@{'/'}" class="nav-link">
                        <i class="nav-icon fas fa-home"></i>
                        <p>
                            쇼핑몰 홈
                        </p>
                    </a>
                </li>
                <li class="nav-header">쇼핑몰 관리</li>
                <li class="nav-item">
                    <a th:href="@{/admin/product/list}" class="nav-link">
                        <i class="nav-icon fas fa-box"></i>
                        <p>
                            상품 현황
                        </p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/member/list}" class="nav-link">
                        <i class="nav-icon fas fa-users"></i>
                        <p>
                            회원 현황
                        </p>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/admin/order/list}" class="nav-link">
                        <i class="nav-icon fas fa-shopping-cart"></i>
                        <p>
                            주문 현황
                        </p>
                    </a>
                </li>

            </ul>
        </nav>
        <!-- /.sidebar-menu -->
    </div>
    <!-- /.sidebar -->
</aside>
</body>
</html>
