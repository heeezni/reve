<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원 목록</title>

    <th:block th:replace="fragments/admin_common_scripts :: adminCommonCss"></th:block>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <!-- Left navbar links -->
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
            </li>
        </ul>

        <!-- Right navbar links -->
        <ul class="navbar-nav ml-auto">
        </ul>
    </nav>
    <!-- /.navbar -->

    <!-- Main Sidebar Container -->
    <div th:replace="fragments/admin_sidebar :: adminSidebar"></div>

    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <!-- Content Header (Page header) -->
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0">회원 목록</h1>
                    </div><!-- /.col -->
                    <div class="col-sm-6">
                        <ol class="breadcrumb float-sm-right">
                            <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Home</a></li>
                            <li class="breadcrumb-item active">회원 목록</li>
                        </ol>
                    </div><!-- /.col -->
                </div><!-- /.row -->
            </div><!-- /.container-fluid -->
        </div>
        <!-- /.content-header -->

        <!-- Main content -->
        <section class="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h3 class="card-title">회원 정보</h3>
                            </div>
                            <!-- /.card-header -->
                            <div class="card-body">
                                <table id="example2" class="table table-bordered table-hover">
                                    <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>로그인 ID</th>
                                        <th>이름</th>
                                        <th>이메일</th>
                                        <th>전화번호</th>
                                        <th>권한</th>
                                        <th>액션</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="user : ${users}">
                                        <td th:text="${user.userId}"></td>
                                        <td><a th:href="@{/admin/member/mypage/{userId}(userId=${user.userId})}" th:text="${user.loginId}"></a></td>
                                        <td th:text="${user.name}"></td>
                                        <td th:text="${user.email}"></td>
                                        <td th:text="${user.phone}"></td>
                                        <td>
                                            <form th:action="@{/admin/member/updateRole}" method="post" class="role-form">
                                                <input type="hidden" name="userId" th:value="${user.userId}">
                                                <select name="role" class="role-select">
                                                    <option value="USER" th:selected="${user.role.name() == 'USER'}">USER</option>
                                                    <option value="ADMIN" th:selected="${user.role.name() == 'ADMIN'}">ADMIN</option>
                                                </select>
                                                <button type="submit" class="role-submit">변경</button>
                                            </form>
                                        </td>
                                        <td class="actions">
                                            <form th:action="@{/admin/member/delete}" method="get" class="delete-form">
                                                <input type="hidden" name="userId" th:value="${user.userId}">
                                                <button type="submit" class="delete-button" onclick="return confirm('정말로 이 회원을 삭제하시겠습니까?');">삭제</button>
                                            </form>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <!-- /.card-body -->
                        </div>
                        <!-- /.card -->
                    </div>
                    <!-- /.col -->
                </div>
                <!-- /.row -->
            </div><!-- /.container-fluid -->
        </section>
        <!-- /.content -->
    </div>
    <!-- /.content-wrapper -->

    <div th:replace="fragments/admin_footer :: adminFooter"></div>

</div>
<!-- ./wrapper -->

    <th:block th:replace="fragments/admin_common_scripts :: adminCommonJs"></th:block>

<script th:if="${message}">
    alert(decodeURIComponent('[[${message}]]'));
</script>
</body>
</html>
