<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head}">
    <title>Rêve</title>
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Banner Slider -->
    <section class="relative h-screen overflow-hidden">
    <!-- 왼쪽 화살표 -->
    <button
      class="banner-arrow left absolute top-1/2 left-8 z-20 -translate-y-1/2 focus:outline-none"
      type="button"
    >
      <i
        class="fas fa-chevron-left text-4xl text-black hover:text-gray-600 transition-colors"
      ></i>
    </button>
    <!-- 오른쪽 화살표 -->
    <button
      class="banner-arrow right absolute top-1/2 right-8 z-20 -translate-y-1/2 focus:outline-none"
      type="button"
    >
      <i
        class="fas fa-chevron-right text-4xl text-black hover:text-gray-600 transition-colors"
      ></i>
    </button>
    <div class="banner-slider h-full relative">
    <div class="banner-slide active absolute inset-0">
      <img
        src="/images/main/banner1.jpg"
        alt="Rêve Banner 1"
        class="w-full h-full object-cover"
      />
      <div class="absolute inset-0 bg-black/30"></div>
      <div class="absolute bottom-20 left-20 text-white z-10">
        <h1 class="text-5xl md:text-6xl font-bold mb-4 leading-tight">
          For Your Dreams,<br />From Rêve
        </h1>
        <a href="/shop/list" class="text-xl hover:underline"
          >지금 보러가기</a
        >
      </div>
    </div>
    <div class="banner-slide absolute inset-0">
      <img
        src="/images/main/banner2.jpg"
        alt="Rêve Banner 2"
        class="w-full h-full object-cover"
      />
      <div class="absolute inset-0 bg-black/30"></div>
      <div class="absolute bottom-20 left-20 text-white z-10">
        <h1 class="text-5xl md:text-6xl font-bold mb-4 leading-tight">
          For Your Dreams,<br />From Rêve
        </h1>
        <a href="/shop/list" class="text-xl hover:underline"
          >지금 보러가기</a
        >
      </div>
    </div>
    </div>
    <div
        class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex space-x-3"
      >
        <span
          class="dot active w-3 h-3 bg-white/50 rounded-full cursor-pointer transition-all duration-300"
          data-slide="0"
        ></span>
        <span
          class="dot w-3 h-3 bg-white/50 rounded-full cursor-pointer transition-all duration-300"
          data-slide="1"
        ></span>
      </div>
    </section>

    <!-- Product Section -->
    <section class="py-20 bg-white">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid md:grid-cols-3 gap-8">
          <!-- Product 1 -->
          <a href="/shop/detail" class="product-item group block">
            <div class="relative overflow-hidden mb-4">
              <img
                src="/images/product/product2.jpg"
                alt="디어 무드 멀티 퍼퓸 70ml"
                class="absolute inset-0 w-full h-80 object-cover opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              />
              <img
                src="/images/product/product1.jpg"
                alt="디어 무드 멀티 퍼퓸 70ml"
                class="w-full h-80 object-cover transition-transform duration-300 group-hover:scale-105"
              />
            </div>
            <div class="text-left">
              <h3 class="text-base font-normal mb-2">
                디어 무드 멀티 퍼퓸 70ml
              </h3>
              <div class="flex items-center space-x-2 mb-2">
                <span class="text-red-500 font-bold text-sm">37%할인</span>
                <span class="text-lg font-bold">판매가 : 24,600원</span>
                <span class="text-gray-400 line-through text-sm">39,000원</span>
              </div>
            </div>
          </a>

          <!-- Product 2 -->
          <a href="/shop/detail" class="product-item group block">
            <div class="relative overflow-hidden mb-4">
              <img
                src="/images/product/product2.jpg"
                alt="베스크 멀티 퍼퓸 70ml"
                class="absolute inset-0 w-full h-80 object-cover opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              />
              <img
                src="/images/product/product1.jpg"
                alt="베스크 멀티 퍼퓸 70ml"
                class="w-full h-80 object-cover transition-transform duration-300 group-hover:scale-105"
              />
            </div>
            <div class="text-left">
              <h3 class="text-base font-normal mb-2">베스크 멀티 퍼퓸 70ml</h3>
              <div class="flex items-center space-x-2 mb-2">
                <span class="text-red-500 font-bold text-sm">37%할인</span>
                <span class="text-lg font-bold">판매가 : 24,600원</span>
                <span class="text-gray-400 line-through text-sm">39,000원</span>
              </div>
            </div>
          </a>

          <!-- Product 3 -->
          <a href="/shop/detail" class="product-item group block">
            <div class="relative overflow-hidden mb-4">
              <img
                src="/images/product/product2.jpg"
                alt="두벨라 멀티 퍼퓸 70ml"
                class="absolute inset-0 w-full h-80 object-cover opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              />
              <img
                src="/images/product/product1.jpg"
                alt="두벨라 멀티 퍼퓸 70ml"
                class="w-full h-80 object-cover transition-transform duration-300 group-hover:scale-105"
              />
            </div>
            <div class="text-left">
              <h3 class="text-base font-normal mb-2">두벨라 멀티 퍼퓸 70ml</h3>
              <div class="flex items-center space-x-2 mb-2">
                <span class="text-red-500 font-bold text-sm">37%할인</span>
                <span class="text-lg font-bold">판매가 : 24,600원</span>
                <span class="text-gray-400 line-through text-sm">39,000원</span>
              </div>
            </div>
          </a>
        </div>
      </div>
    </section>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Login Modal Fragment -->
    <div th:replace="~{fragments/modal :: loginModal}"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
