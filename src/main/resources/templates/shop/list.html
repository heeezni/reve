<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head}">
    <title>상품 목록 - Rêve</title>
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="pt-20">
      <div class="min-h-screen bg-gray-50 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <!-- Page Title -->
          <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">상품 목록</h1>
            <p class="text-gray-600">Rêve의 프리미엄 향수를 만나보세요</p>
          </div>

          <!-- Search and Filter Section -->
          <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <div
              class="flex flex-col lg:flex-row lg:items-center lg:justify-between space-y-4 lg:space-y-0"
            >
              <!-- Search Bar -->
              <div class="flex-1 max-w-md">
                <form id="searchForm" method="get" th:action="@{/shop/list}">
                  <div class="relative">
                    <label>
                      <input
                              type="text"
                              name="search"
                              placeholder="상품명을 검색하세요..."
                              th:value="${search}"
                              class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                      />
                    </label>
                    <div
                      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                    >
                      <i class="fas fa-search text-gray-400"></i>
                    </div>
                  </div>
                </form>
              </div>

              <!-- Filter Options -->
              <div class="flex items-center space-x-4">
                <form id="filterForm" method="get" th:action="@{/shop/list}" class="flex items-center space-x-4">
                  <!-- 향 필터 -->
                  <label>
                    <select name="scent" onchange="document.getElementById('filterForm').submit();"
                            class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent">
                      <option value="" th:selected="${scent == null or scent == ''}">전체</option>
                      <option value="플로럴" th:selected="${scent == '플로럴'}">플로럴</option>
                      <option value="시트러스" th:selected="${scent == '시트러스'}">시트러스</option>
                      <option value="우디" th:selected="${scent == '우디'}">우디</option>
                      <option value="머스크" th:selected="${scent == '머스크'}">머스크</option>
                    </select>
                  </label>

                  <!-- 정렬 -->
                  <label>
                    <select name="sort" onchange="document.getElementById('filterForm').submit();"
                            class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent">
                      <option value="new" th:selected="${sort == 'new' or sort == null}">최신순</option>
                      <option value="review" th:selected="${sort == 'review'}">인기순</option>
                      <option value="price_asc" th:selected="${sort == 'price_asc'}">가격낮은순</option>
                      <option value="price_desc" th:selected="${sort == 'price_desc'}">가격높은순</option>
                    </select>
                  </label>
                </form>
                <button
                  class="flex items-center space-x-2 px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
                >
                  <i class="fas fa-filter text-gray-600"></i>
                  <span class="text-sm text-gray-700">필터</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Product Grid -->
          <div class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div th:each="perfume : ${perfumeList}" class="bg-white rounded-lg shadow-sm overflow-hidden group">
              <div class="relative overflow-hidden">
                <img
                        th:src="@{${perfume.imageUrl}}"
                        th:alt="${perfume.perfumeName}"
                        class="w-full h-80 object-cover group-hover:scale-105 transition-transform duration-300"
                />
                <img
                        th:src="@{${perfume.hoverImageUrl}}"
                        th:alt="${perfume.perfumeName}"
                        class="absolute inset-0 w-full h-80 object-cover opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                />

                <!-- Sale Badge -->
                <div class="absolute top-4 left-4" th:if="${perfume.discount > 0}">
                  <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-red-500 text-white">
                    <span th:text="${(perfume.discount * 100) / perfume.price}">0</span>% 할인
                  </span>
                </div>

                <!-- Quick Actions -->
                <div class="absolute top-4 right-4 space-y-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                  <button class="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-md hover:bg-gray-50 transition-colors">
                    <i class="far fa-heart text-gray-600"></i>
                  </button>
                  <button class="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-md hover:bg-gray-50 transition-colors">
                    <i class="fas fa-search text-gray-600"></i>
                  </button>
                </div>
              </div>

              <div class="p-4">
                <div class="mb-2">
                  <!-- 카테고리 필드가 없으므로 임시 텍스트로 대체 -->
                  <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">
                    향수
                  </span>
                  <span
                          class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium"
                          th:classappend="
                            ${perfume.scent} == '플로럴' ? ' bg-pink-100 text-pink-800' :
                            (${perfume.scent} == '시트러스' ? ' bg-green-100 text-green-800' :
                            (${perfume.scent} == '우디' ? ' bg-purple-100 text-purple-800' :
                            (${perfume.scent} == '머스크' ? ' bg-yellow-100 text-yellow-800' : ' bg-gray-100 text-gray-800')))
                          "
                          th:text="${perfume.scent}">
                    향
                  </span>

                </div>

                <h3 class="text-lg font-medium text-gray-800 mb-2 group-hover:text-gray-600 transition-colors">
                  <a th:href="@{'/shop/detail?id=' + ${perfume.perfumeId}}" th:text="${perfume.perfumeName}">상품명</a>
                </h3>

                <p class="text-sm text-gray-600 mb-3" th:text="${perfume.description}">
                  향 설명
                </p>

                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center space-x-2">
                    <!-- 할인 가격 계산은 없으니 그냥 price 사용 -->
                    <span class="text-xl font-bold text-gray-800" th:text="${#numbers.formatInteger(perfume.price - perfume.discount, 3, 'COMMA')} + '원'">
                      할인 가격
                    </span>
                    <span class="text-sm text-gray-400 line-through" th:text="${#numbers.formatInteger(perfume.price, 3, 'COMMA')} + '원'"
                          th:if="${perfume.discount > 0}">
                      원래 가격
                    </span>
                  </div>
                  <div class="flex items-center space-x-1">
                    <i class="fas fa-star text-yellow-400 text-sm"></i>
                    <span class="text-sm text-gray-600" th:text="${perfume.averageRating}">4.8</span>
                    <span class="text-sm text-gray-500" th:text="'(' + ${perfume.reviewCount} + ')'">(127)</span>
                  </div>
                </div>

                <div class="flex space-x-2">
                  <button class="add-to-cart-btn flex-1 bg-gray-800 text-white py-2 px-4 rounded-md hover:bg-gray-700 transition-colors text-sm font-medium"
                          th:attr="data-product-name=${perfume.perfumeName},data-product-price=${perfume.price - perfume.discount}">
                    장바구니
                  </button>
                  <button class="flex-1 border border-gray-300 text-gray-700 py-2 px-4 rounded-md hover:bg-gray-50 transition-colors text-sm font-medium">
                    구매하기
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Pagination -->
          <div class="mt-12 flex items-center justify-center">
            <nav class="flex items-center space-x-2">
              <button
                class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
              >
                <i class="fas fa-chevron-left"></i>
              </button>

              <button
                class="px-3 py-2 text-sm font-medium text-white bg-gray-800 border border-gray-800 rounded-md"
              >
                1
              </button>
              <button
                class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
              >
                2
              </button>
              <button
                class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
              >
                3
              </button>

              <button
                class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
              >
                <i class="fas fa-chevron-right"></i>
              </button>
            </nav>
          </div>

          <!-- Category Quick Links -->
          <div class="mt-12 bg-white rounded-lg shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-6">
              향기 카테고리
            </h3>
            <div class="grid md:grid-cols-4 gap-4">
              <a
                href="#"
                class="flex items-center p-4 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <div
                  class="w-12 h-12 bg-pink-100 rounded-full flex items-center justify-center mr-4"
                >
                  <i class="fas fa-spa text-pink-500"></i>
                </div>
                <div>
                  <p class="font-medium text-gray-800">플로럴</p>
                  <p class="text-sm text-gray-600">꽃향의 로맨틱한 매력</p>
                </div>
              </a>

              <a
                href="#"
                class="flex items-center p-4 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <div
                  class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center mr-4"
                >
                  <i class="fas fa-lemon text-green-500"></i>
                </div>
                <div>
                  <p class="font-medium text-gray-800">시트러스</p>
                  <p class="text-sm text-gray-600">상쾌한 과일향의 활기</p>
                </div>
              </a>

              <a
                href="#"
                class="flex items-center p-4 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <div
                  class="w-12 h-12 bg-purple-100 rounded-full flex items-center justify-center mr-4"
                >
                  <i class="fas fa-tree text-purple-500"></i>
                </div>
                <div>
                  <p class="font-medium text-gray-800">우디</p>
                  <p class="text-sm text-gray-600">깊이 있는 나무향의 매력</p>
                </div>
              </a>

              <a
                href="#"
                class="flex items-center p-4 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <div
                  class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center mr-4"
                >
                  <i class="fas fa-gem text-yellow-500"></i>
                </div>
                <div>
                  <p class="font-medium text-gray-800">머스크</p>
                  <p class="text-sm text-gray-600">신비로운 동물향의 우아함</p>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Login Modal Fragment -->
    <div th:replace="~{fragments/modal :: loginModal}"></div>

    <script src="/js/script.js"></script>
    <script>
      // Search functionality
      const searchInput = document.querySelector('input[type="text"]');
      searchInput.addEventListener('input', function () {
        const searchTerm = this.value.toLowerCase();
        const productItems = document.querySelectorAll(
          '.bg-white.rounded-lg.shadow-sm'
        );

        productItems.forEach((item) => {
          const title = item.querySelector('h3 a').textContent.toLowerCase();
          if (title.includes(searchTerm)) {
            item.style.display = '';
          } else {
            item.style.display = 'none';
          }
        });
      });

      // Category filter functionality
      const categoryFilter = document.querySelector('select:first-of-type');
      categoryFilter.addEventListener('change', function () {
        const selectedCategory = this.value;
        const productItems = document.querySelectorAll(
          '.bg-white.rounded-lg.shadow-sm'
        );

        productItems.forEach((item) => {
          const category = item.querySelector(
            '.inline-flex.items-center.px-2.py-1.rounded-full.text-xs.font-medium'
          ).textContent;
          if (selectedCategory === '전체' || category === selectedCategory) {
            item.style.display = '';
          } else {
            item.style.display = 'none';
          }
        });
      });

      // Pagination functionality
      document.querySelectorAll('nav button').forEach((button) => {
        button.addEventListener('click', function () {
          // Remove active state from all buttons
          document.querySelectorAll('nav button').forEach((btn) => {
            btn.classList.remove(
              'text-white',
              'bg-gray-800',
              'border-gray-800'
            );
            btn.classList.add('text-gray-700', 'bg-white', 'border-gray-300');
          });

          // Add active state to clicked button
          this.classList.remove('text-gray-700', 'bg-white', 'border-gray-300');
          this.classList.add('text-white', 'bg-gray-800', 'border-gray-800');
        });
      });

      // Wishlist functionality
      document.querySelectorAll('.fa-heart').forEach((heart) => {
        heart.addEventListener('click', function (e) {
          e.preventDefault();
          if (this.classList.contains('far')) {
            this.classList.remove('far');
            this.classList.add('fas');
            this.style.color = '#ef4444';
          } else {
            this.classList.remove('fas');
            this.classList.add('far');
            this.style.color = '';
          }
        });
      });

      // Cart animation functionality
      document.querySelectorAll('.add-to-cart-btn').forEach((btn) => {
        btn.addEventListener('click', function (e) {
          e.preventDefault();

          const productName = this.getAttribute('data-product-name');
          const productPrice = this.getAttribute('data-product-price');

          // Get button position
          const buttonRect = this.getBoundingClientRect();
          const cartIcon = document.querySelector('#cart-count');
          const cartRect = cartIcon.getBoundingClientRect();

          // Create flying element
          const flyingElement = document.createElement('div');
          flyingElement.innerHTML = `
            <div class="fixed z-50 bg-gray-800 text-white text-xs px-2 py-1 rounded-full shadow-lg">
              ${productName}
            </div>
          `;
          flyingElement.style.position = 'fixed';
          flyingElement.style.left =
            buttonRect.left + buttonRect.width / 2 + 'px';
          flyingElement.style.top =
            buttonRect.top + buttonRect.height / 2 + 'px';
          flyingElement.style.zIndex = '9999';
          flyingElement.style.pointerEvents = 'none';
          flyingElement.style.transition =
            'all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

          document.body.appendChild(flyingElement);

          // Animate to cart
          setTimeout(() => {
            flyingElement.style.left =
              cartRect.left + cartRect.width / 2 + 'px';
            flyingElement.style.top = cartRect.top + cartRect.height / 2 + 'px';
            flyingElement.style.transform = 'scale(0.3)';
            flyingElement.style.opacity = '0';
          }, 50);

          // Update cart count
          setTimeout(() => {
            const currentCount = parseInt(cartIcon.textContent);
            cartIcon.textContent = currentCount + 1;

            // Add bounce animation to cart count
            cartIcon.style.transform = 'scale(1.3)';
            setTimeout(() => {
              cartIcon.style.transform = 'scale(1)';
            }, 200);

            // Remove flying element
            document.body.removeChild(flyingElement);

            // Show success message
            showCartSuccess(productName);
          }, 800);
        });
      });

      // Show cart success message
      function showCartSuccess(productName) {
        const successMessage = document.createElement('div');
        successMessage.innerHTML = `
          <div class="fixed top-20 right-4 bg-green-500 text-white px-4 py-2 rounded-md shadow-lg z-50 transform translate-x-full transition-transform duration-300">
            <i class="fas fa-check mr-2"></i>
            ${productName}이(가) 장바구니에 추가되었습니다!
          </div>
        `;
        document.body.appendChild(successMessage);

        // Slide in
        setTimeout(() => {
          successMessage.querySelector('div').style.transform = 'translateX(0)';
        }, 100);

        // Slide out and remove
        setTimeout(() => {
          successMessage.querySelector('div').style.transform =
            'translateX(full)';
          setTimeout(() => {
            document.body.removeChild(successMessage);
          }, 300);
        }, 3000);
      }
    </script>
  </body>
</html>
