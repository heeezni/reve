<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}">
  <title>향수 등록 - Rêve 관리자</title>
</head>
<body class="font-sans text-gray-800">

<!-- 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="pt-20 max-w-3xl mx-auto px-6">
  <h1 class="text-2xl font-bold mb-6">향수 등록</h1>

  <form th:action="@{/admin/shop/regist}" method="post" enctype="multipart/form-data" class="space-y-6">
    <div>
      <label for="perfumeName" class="block mb-1 font-semibold">향수 이름</label>
      <input
              type="text"
              id="perfumeName"
              name="perfumeName"
              placeholder="향수 이름을 입력하세요"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800"
              th:value="${perfume?.perfumeName}"
      />
    </div>

    <div>
      <label for="scent" class="block mb-1 font-semibold">향 종류</label>
      <select
              id="scent"
              name="scent"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800"
              th:value="${perfume?.scent}"
      >
        <option value="" disabled selected>향을 선택하세요</option>
        <option value="플로럴" th:selected="${perfume?.scent == '플로럴'}">플로럴</option>
        <option value="시트러스" th:selected="${perfume?.scent == '시트러스'}">시트러스</option>
        <option value="우디" th:selected="${perfume?.scent == '우디'}">우디</option>
        <option value="머스크" th:selected="${perfume?.scent == '머스크'}">머스크</option>
      </select>
    </div>

    <!-- 향수 설명 타이틀 -->
    <div>
      <label for="descriptionTitle" class="block mb-1 font-semibold">설명 타이틀</label>
      <input
              type="text"
              id="descriptionTitle"
              name="descriptionTitle"
              placeholder="한 줄 소개를 입력하세요 (예: 부드러운 꽃향기가 매력적인 향수)"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800"
              th:value="${perfume?.descriptionTitle ?: ''}"
      />
    </div>

    <!-- 향수 설명 -->
    <div>
      <label for="description" class="block mb-1 font-semibold">향수 설명</label>
      <textarea
              id="description"
              name="description"
              rows="4"
              placeholder="향수 설명을 입력하세요"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 resize-none focus:outline-none focus:ring-2 focus:ring-gray-800"
              th:text="${perfume?.description}"
      ></textarea>
    </div>

    <div>
      <label for="volume" class="block mb-1 font-semibold">용량</label>
      <input
              type="text"
              id="volume"
              name="volume"
              placeholder="예: 70ml"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800"
              th:value="${perfume?.volume}"
      />
    </div>

    <div>
      <label for="price" class="block mb-1 font-semibold">가격</label>
      <input
              type="number"
              id="price"
              name="price"
              min="0"
              placeholder="가격을 입력하세요"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800"
              th:value="${perfume?.price}"
      />
    </div>

    <div>
      <label for="discount" class="block mb-1 font-semibold">할인 가격</label>
      <input
              type="number"
              id="discount"
              name="discount"
              min="0"
              placeholder="할인 가격을 입력하세요 (없으면 0)"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800"
              th:value="${perfume?.discount}"
      />
    </div>

    <div>
      <label for="stock" class="block mb-1 font-semibold">재고</label>
      <input
              type="number"
              id="stock"
              name="stock"
              min="0"
              placeholder="재고 수량을 입력하세요"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800"
              th:value="${perfume?.stock}"
      />
    </div>

    <div>
      <label for="imageFile" class="block mb-1 font-semibold">대표 이미지 파일</label>
      <input
              type="file"
              id="imageFile"
              name="imageFile"
              accept="image/*"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800"
      />
    </div>

    <div>
      <label for="hoverImageFile" class="block mb-1 font-semibold">호버 이미지 파일</label>
      <input
              type="file"
              id="hoverImageFile"
              name="hoverImageFile"
              accept="image/*"
              required
              class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800"
      />
    </div>

    <div class="flex justify-end space-x-4 pt-4 border-t">
      <a href="/shop/list" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition">취소</a>
      <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">등록</button>
    </div>
  </form>
</main>

<!-- 푸터 -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
<script>
  const form = document.querySelector('form');

  form.addEventListener('submit', function(event) {
    // 필수 입력 요소들을 선택 (아이디 기준)
    const requiredFields = [
      'perfumeName',
      'scent',
      'descriptionTitle',
      'description',
      'volume',
      'price',
      'discount',
      'stock',
      'imageFile',
      'hoverImageFile'
    ];

    for (const fieldId of requiredFields) {
      const element = document.getElementById(fieldId);
      if (!element) continue;

      // 파일 입력 타입 검사
      if (element.type === 'file') {
        if (element.files.length === 0) {
          alert(`${element.previousElementSibling.innerText}을(를) 선택해 주세요.`);
          element.focus();
          event.preventDefault();
          return;
        }
      }
      // 셀렉트박스 검사
      else if (element.tagName === 'SELECT') {
        if (!element.value) {
          alert(`${element.previousElementSibling.innerText}을(를) 선택해 주세요.`);
          element.focus();
          event.preventDefault();
          return;
        }
      }
      // 그 외 텍스트, 숫자, textarea 검사
      else {
        if (!element.value.trim()) {
          alert(`${element.previousElementSibling.innerText}을(를) 입력해 주세요.`);
          element.focus();
          event.preventDefault();
          return;
        }
      }
    }
  });
</script>
