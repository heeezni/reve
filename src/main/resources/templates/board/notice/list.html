<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head}">
    <title>공지사항 - Rêve</title>
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="pt-20">
      <div class="min-h-screen bg-gray-50 py-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
          <!-- Page Title -->
          <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">공지사항</h1>
            <p class="text-gray-600">
              Rêve의 새로운 소식과 중요한 안내사항을 확인하세요
            </p>
          </div>

          <!-- Search and Filter Section -->
          <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <form id="notice-filter-form" th:action="@{/board/notice/list}" method="get">
              <div
                class="flex flex-col md:flex-row md:items-center md:justify-between space-y-4 md:space-y-0"
              >
                <!-- Search Bar -->
                <div class="flex-1 max-w-md">
                  <div class="relative">
                    <label>
                      <input
                        type="text"
                        name="keyword"
                        th:value="${keyword}"
                        placeholder="공지사항 검색..."
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                      />
                    </label>
                    <div
                      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                    >
                      <i class="fas fa-search text-gray-400"></i>
                    </div>
                  </div>
                </div>

                <!-- Filter Options -->
                <div class="flex items-center space-x-4">
                  <label>
                    <select
                      name="category"
                      onchange="this.form.submit()"
                      class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                    >
                      <option value="">전체</option>
                      <option value="일반" th:selected="${category == '일반'}">일반</option>
                      <option value="이벤트" th:selected="${category == '이벤트'}">이벤트</option>
                      <option value="시스템" th:selected="${category == '시스템'}">시스템</option>
                      <option value="배송" th:selected="${category == '배송'}">배송</option>
                    </select>
                  </label>
                  <label>
                    <select
                      name="sort"
                      onchange="this.form.submit()"
                      class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                    >
                      <option value="createdAt,desc" th:selected="${#strings.contains(sort, 'createdAt,desc')}">최신순</option>
                      <option value="hit,desc" th:selected="${#strings.contains(sort, 'hit,desc')}">조회순</option>
                      <option value="title,asc" th:selected="${#strings.contains(sort, 'title,asc')}">제목순</option>
                    </select>
                  </label>
                </div>
                <!-- Admin Button: Register Notice -->
                <div th:if="${isAdmin}">
                  <a
                    href="/admin/board/notice/register"
                    class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500"
                  >
                    <i class="fas fa-plus-circle mr-2"></i>
                    공지사항 등록
                  </a>
                </div>
              </div>
            </form>
          </div>

          <!-- Notice List -->
          <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <!-- Table Header -->
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
              <div
                class="grid grid-cols-12 gap-4 text-sm font-medium text-gray-700"
              >
                <div class="col-span-1 text-center">번호</div>
                <div class="col-span-1 text-center">분류</div>
                <div class="col-span-6">제목</div>
                <div class="col-span-2 text-center">작성일</div>
                <div class="col-span-1 text-center">조회</div>
                <div class="col-span-1 text-center">첨부</div>
              </div>
            </div>

            <!-- Table Body -->
            <div class="divide-y divide-gray-200">
              <div th:each="notice, iStat : ${notices.content}" class="px-6 py-4 hover:bg-gray-50 transition-colors">
                <div class="grid grid-cols-12 gap-4 items-center">
                  <div class="col-span-1 text-center">
                    <span
                      th:if="${notice.important}"
                      class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-red-100 text-red-800"
                    >
                      공지
                    </span>
                    <span th:unless="${notice.important}" th:text="${notices.totalElements - (notices.number * notices.size) - iStat.index}" class="text-sm text-gray-600"></span>
                  </div>
                  <div class="col-span-1 text-center">
                    <span
                      th:text="${notice.category}"
                      th:classappend="${notice.category == '이벤트' ? 'bg-blue-100 text-blue-800' : (notice.category == '배송' ? 'bg-green-100 text-green-800' : (notice.category == '시스템' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'))}"
                      class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium"
                    >
                    </span>
                  </div>
                  <div class="col-span-6">
                    <a
                      th:href="@{/board/notice/detail/{noticeId}(noticeId=${notice.noticeId})}"
                      th:text="${notice.title}"
                      class="text-gray-800 hover:text-gray-600 font-medium flex items-center"
                    >
                    </a>
                  </div>
                  <div class="col-span-2 text-center text-sm text-gray-600" th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">
                  </div>
                  <div class="col-span-1 text-center text-sm text-gray-600" th:text="${notice.hit}">
                  </div>
                  <div class="col-span-1 text-center">
                    <i th:if="${notice.attachmentFiles != null and !notice.attachmentFiles.isEmpty()}" class="fas fa-paperclip text-gray-400"></i>
                    <span th:unless="${notice.attachmentFiles != null and !notice.attachmentFiles.isEmpty()}" class="text-gray-400">-</span>
                  </div>
                </div>
              </div>
              <div th:if="${notices.isEmpty()}" class="px-6 py-4 text-center text-gray-500">
                등록된 공지사항이 없습니다.
              </div>
            </div>
          </div>

          <!-- Pagination -->
          <div class="mt-8 flex items-center justify-center">
            <nav class="flex items-center space-x-2">
              <!-- Previous Page -->
              <a th:if="${notices.hasPrevious()}"
                 th:href="@{/board/notice/list(page=${notices.number - 1}, keyword=${keyword}, category=${category})}"
                 class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                <i class="fas fa-chevron-left"></i>
              </a>
              <button th:unless="${notices.hasPrevious()}"
                      class="px-3 py-2 text-sm font-medium text-gray-500 bg-white border border-gray-300 rounded-md disabled:opacity-50 disabled:cursor-not-allowed"
                      disabled>
                <i class="fas fa-chevron-left"></i>
              </button>

              <!-- Page Numbers -->
              <th:block th:each="i : ${#numbers.sequence(0, notices.totalPages - 1)}">
                <a th:href="@{/board/notice/list(page=${i}, keyword=${keyword}, category=${category})}"
                   th:text="${i + 1}"
                   th:classappend="${i == notices.number ? 'text-white bg-gray-800 border-gray-800' : 'text-gray-700 bg-white border-gray-300'}"
                   class="px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-50">
                </a>
              </th:block>

              <!-- Next Page -->
              <a th:if="${notices.hasNext()}"
                 th:href="@{/board/notice/list(page=${notices.number + 1}, keyword=${keyword}, category=${category})}"
                 class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                <i class="fas fa-chevron-right"></i>
              </a>
              <button th:unless="${notices.hasNext()}"
                      class="px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md disabled:opacity-50 disabled:cursor-not-allowed"
                      disabled>
                <i class="fas fa-chevron-right"></i>
              </button>
            </nav>
          </div>

          <!-- Quick Links -->
          <div class="mt-8 bg-white rounded-lg shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">빠른 링크</h3>
            <div class="grid md:grid-cols-3 gap-4">
              <a
                href="/board/qna/list"
                class="flex items-center p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <i class="fas fa-question-circle text-blue-500 mr-3"></i>
                <div>
                  <p class="font-medium text-gray-800">자주 묻는 질문</p>
                  <p class="text-sm text-gray-600">FAQ에서 답변을 찾아보세요</p>
                </div>
              </a>
              <a
                href="/info/policy"
                class="flex items-center p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <i class="fas fa-shield-alt text-green-500 mr-3"></i>
                <div>
                  <p class="font-medium text-gray-800">개인정보처리방침</p>
                  <p class="text-sm text-gray-600">
                    개인정보 보호 정책을 확인하세요
                  </p>
                </div>
              </a>
              <a
                href="/info/terms"
                class="flex items-center p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <i class="fas fa-file-contract text-purple-500 mr-3"></i>
                <div>
                  <p class="font-medium text-gray-800">이용약관</p>
                  <p class="text-sm text-gray-600">
                    서비스 이용 약관을 확인하세요
                  </p>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Login Modal Fragment -->
    <div th:replace="~{fragments/modal :: loginModal}"></div>

    <script src="/js/script.js"></script>
    <script>
      // Search functionality
      const searchInput = document.querySelector('input[type="text"]');
      searchInput.addEventListener('input', function () {
        const searchTerm = this.value.toLowerCase();
        const noticeItems = document.querySelectorAll('.divide-y > div');

        noticeItems.forEach((item) => {
          const title = item.querySelector('a').textContent.toLowerCase();
          if (title.includes(searchTerm)) {
            item.style.display = '';
          } else {
            item.style.display = 'none';
          }
        });
      });

      

      
    </script>
  </body>
</html>
