<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head}">
    <title>공지사항 상세 - Rêve</title>
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="pt-20">
      <div class="min-h-screen bg-gray-50 py-12">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
          <!-- Breadcrumb -->
          <nav class="mb-6">
            <ol class="flex items-center space-x-2 text-sm text-gray-600">
              <li><a href="/" class="hover:text-gray-800">홈</a></li>
              <li><i class="fas fa-chevron-right text-xs"></i></li>
              <li>
                <a href="/board/notice/list" class="hover:text-gray-800"
                  >공지사항</a
                >
              </li>
              <li><i class="fas fa-chevron-right text-xs"></i></li>
              <li class="text-gray-800">상세보기</li>
            </ol>
          </nav>

          <!-- Article Header -->
          <div class="bg-white rounded-lg shadow-sm p-8 mb-6">
            <div class="border-b border-gray-200 pb-6 mb-6">
              <!-- Category and Title -->
              <div class="flex items-center space-x-3 mb-4">
                <span
                  th:text="${notice.category}"
                  th:classappend="${notice.category == '이벤트' ? 'bg-blue-100 text-blue-800' : (notice.category == '배송' ? 'bg-green-100 text-green-800' : (notice.category == '시스템' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'))}"
                  class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                >
                </span>
                <span
                  th:if="${notice.important}"
                  class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800"
                >
                  공지
                </span>
              </div>

              <h1 class="text-3xl font-bold text-gray-800 mb-4 leading-tight" th:text="${notice.title}">
              </h1>
              <!-- Admin Buttons -->
              <div th:if="${isAdmin}" class="flex items-center justify-end space-x-2 mb-4">
                <a
                  th:href="@{/admin/board/notice/edit/{noticeId}(noticeId=${notice.noticeId})}"
                  class="inline-flex items-center px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700 transition-colors font-medium text-sm"
                >
                  <i class="fas fa-edit mr-2"></i>
                  수정
                </a>
                <button
                  type="button"
                  th:onclick="|deleteNotice(${notice.noticeId})|"
                  class="inline-flex items-center px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors font-medium text-sm"
                >
                  <i class="fas fa-trash-alt mr-2"></i>
                  삭제
                </button>
              </div>

              <!-- Article Meta -->
              <div
                class="flex items-center justify-between text-sm text-gray-600"
              >
                <div class="flex items-center space-x-6">
                  <span th:text="|작성일: ${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}|"></span>
                  <span th:text="|조회수: ${notice.hit}|"></span>
                  <span th:if="${notice.attachmentFiles != null and !notice.attachmentFiles.isEmpty()}" th:text="|첨부파일: ${notice.attachmentFiles.size()}개|"></span>
                </div>
                <div class="flex items-center space-x-4">
                  <button
                    class="flex items-center space-x-1 text-gray-500 hover:text-gray-700"
                  >
                    <i class="far fa-heart"></i>
                    <span>스크랩</span>
                  </button>
                  <button
                    class="flex items-center space-x-1 text-gray-500 hover:text-gray-700"
                  >
                    <i class="fas fa-share"></i>
                    <span>공유</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Article Content -->
            <article class="prose prose-lg max-w-none">
              <div class="text-gray-800 leading-relaxed space-y-6" th:utext="${notice.content}">
              </div>
            </article>

            <!-- Attachments -->
            <div th:if="${notice.attachmentFiles != null and !notice.attachmentFiles.isEmpty()}" class="mt-8 pt-6 border-t border-gray-200">
              <h3 class="text-lg font-semibold text-gray-800 mb-4">첨부파일</h3>
              <div class="space-y-2">
                <a
                  th:each="filePath : ${notice.attachmentFiles}"
                  th:href="@{${filePath}}"
                  target="_blank"
                  class="flex items-center space-x-3 p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
                >
                  <i th:classappend="${filePath.endsWith('.pdf') ? 'fas fa-file-pdf text-red-500' : (filePath.endsWith('.jpg') || filePath.endsWith('.jpeg') || filePath.endsWith('.png') || filePath.endsWith('.gif') ? 'fas fa-file-image text-blue-500' : 'fas fa-file text-gray-500')}"></i>
                  <span th:text="${filePath.substring(filePath.lastIndexOf('/') + 1)}"></span>
                  <!-- 파일 크기는 현재 Notice 엔티티에 없으므로 표시하지 않음 -->
                  <!-- <span class="text-sm text-gray-500">(2.3MB)</span> -->
                </a>
              </div>
            </div>
          </div>

          <!-- Navigation Buttons -->
          

          <!-- Related Notices -->
          <div class="bg-white rounded-lg shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">
              관련 공지사항
            </h3>
            <div class="space-y-3">
              <a
                href="#"
                class="flex items-center justify-between p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <div class="flex items-center space-x-3">
                  <span
                    class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800"
                  >
                    배송
                  </span>
                  <span class="text-gray-800"
                    >배송 시스템 점검 안내 (2025년 2월 20일)</span
                  >
                </div>
                <span class="text-sm text-gray-500">2025.02.17</span>
              </a>

              <a
                href="#"
                class="flex items-center justify-between p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <div class="flex items-center space-x-3">
                  <span
                    class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-800"
                  >
                    일반
                  </span>
                  <span class="text-gray-800">Rêve 회원 등급 혜택 안내</span>
                </div>
                <span class="text-sm text-gray-500">2025.02.16</span>
              </a>

              <a
                href="#"
                class="flex items-center justify-between p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <div class="flex items-center space-x-3">
                  <span
                    class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-purple-100 text-purple-800"
                  >
                    시스템
                  </span>
                  <span class="text-gray-800"
                    >웹사이트 개편 및 서비스 개선 안내</span
                  >
                </div>
                <span class="text-sm text-gray-500">2025.02.15</span>
              </a>
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="mt-8 grid md:grid-cols-3 gap-4">
            <a
              href="/board/qna/list"
              class="flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
            >
              <div class="text-center">
                <i
                  class="fas fa-question-circle text-2xl text-blue-500 mb-2"
                ></i>
                <p class="font-medium text-gray-800">자주 묻는 질문</p>
                <p class="text-sm text-gray-600">FAQ에서 답변을 찾아보세요</p>
              </div>
            </a>

            <a
              href="/member/login"
              class="flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
            >
              <div class="text-center">
                <i class="fas fa-headset text-2xl text-green-500 mb-2"></i>
                <p class="font-medium text-gray-800">고객센터</p>
                <p class="text-sm text-gray-600">1:1 문의 및 상담</p>
              </div>
            </a>

            <a
              href="/shop/list"
              class="flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
            >
              <div class="text-center">
                <i
                  class="fas fa-shopping-bag text-2xl text-purple-500 mb-2"
                ></i>
                <p class="font-medium text-gray-800">쇼핑하기</p>
                <p class="text-sm text-gray-600">Rêve 상품 둘러보기</p>
              </div>
            </a>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Login Modal Fragment -->
    <div th:replace="~{fragments/modal :: loginModal}"></div>

    <script src="/js/script.js"></script>
    <script th:inline="javascript">
      function deleteNotice(noticeId) {
        if (confirm('정말로 이 공지사항을 삭제하시겠습니까?')) {
          $.ajax({
            url: '/admin/board/notice/' + noticeId,
            type: 'DELETE',
            success: function(result) {
              alert('공지사항이 삭제되었습니다.');
              window.location.href = '/board/notice/list';
            },
            error: function(xhr, status, error) {
              alert('공지사항 삭제에 실패했습니다: ' + (xhr.responseText || error));
            }
          });
        }
      }

      // Share functionality
      document
        .querySelector('button:has(.fa-share)')
        .addEventListener('click', function () {
          if (navigator.share) {
            navigator.share({
              title: '[이벤트] 봄맞이 신상품 출시 기념 할인 이벤트 안내',
              text: 'Rêve 봄맞이 특별 이벤트를 확인해보세요!',
              url: window.location.href,
            });
          } else {
            // Fallback for browsers that don't support Web Share API
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
              alert('링크가 클립보드에 복사되었습니다.');
            });
          }
        });

      // Scrap functionality
      document
        .querySelector('button:has(.fa-heart)')
        .addEventListener('click', function () {
          const icon = this.querySelector('i');
          if (icon.classList.contains('far')) {
            icon.classList.remove('far');
            icon.classList.add('fas');
            icon.style.color = '#ef4444';
            this.querySelector('span').textContent = '스크랩됨';
          } else {
            icon.classList.remove('fas');
            icon.classList.add('far');
            icon.style.color = '';
            this.querySelector('span').textContent = '스크랩';
          }
        });

      // File download simulation
      document.querySelectorAll('a[href="#"]').forEach((link) => {
        if (
          link.querySelector('.fa-file-pdf') ||
          link.querySelector('.fa-file-image')
        ) {
          link.addEventListener('click', function (e) {
            e.preventDefault();
            const fileName = this.querySelector('span').textContent;
            alert(`${fileName} 다운로드를 시작합니다.`);
          });
        }
      });
    </script>
  </body>
</html>
