  <head th:replace="~{fragments/header :: head(title=${notice.title} + ' | Rêve')}">
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="pt-20">
      <div class="min-h-screen bg-gray-50 py-12">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
          <!-- Breadcrumb -->
          <nav class="mb-6">
            <ol class="flex items-center space-x-2 text-sm text-gray-600">
              <li><a href="/" class="hover:text-gray-800">홈</a></li>
              <li><i class="fas fa-chevron-right text-xs"></i></li>
              <li>
                <a href="/board/notice/list" class="hover:text-gray-800"
                  >공지사항</a
                >
              </li>
              <li><i class="fas fa-chevron-right text-xs"></i></li>
              <li class="text-gray-800">상세보기</li>
            </ol>
          </nav>

          <!-- Article Header -->
          <div class="bg-white rounded-lg shadow-sm p-8 mb-6">
            <div class="border-b border-gray-200 pb-6 mb-6">
              <!-- Category and Title -->
              <div class="flex items-center space-x-3 mb-4">
                <span
                  th:text="${notice.category}"
                  th:classappend="${notice.category == '이벤트' ? 'bg-blue-100 text-blue-800' : (notice.category == '배송' ? 'bg-green-100 text-green-800' : (notice.category == '시스템' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'))}"
                  class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                >
                </span>
                <span
                  th:if="${notice.important}"
                  class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-yellow-100 text-yellow-800"
                >
                  <i class="fas fa-star mr-1"></i> 중요
                </span>
              </div>

              <h1 class="text-3xl font-bold text-gray-800 mb-4 leading-tight" th:text="${notice.title}">
              </h1>
              <!-- Admin Buttons -->
              <div th:if="${isAdmin}" class="flex items-center justify-end space-x-2 mb-4">
                <a
                  th:href="@{/admin/board/notice/edit/{noticeId}(noticeId=${notice.noticeId})}"
                  class="inline-flex items-center px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors font-medium text-sm"
                >
                  <i class="fas fa-edit mr-2"></i>
                  수정
                </a>
                <button
                  type="button"
                  th:onclick="|deleteNotice(${notice.noticeId})|"
                  class="inline-flex items-center px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors font-medium text-sm"
                >
                  <i class="fas fa-trash-alt mr-2"></i>
                  삭제
                </button>
              </div>

              <!-- Article Meta -->
              <div
                class="flex items-center justify-between text-sm text-gray-600"
              >
                <div class="flex items-center space-x-6">
                  <span th:text="|작성일: ${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}|"></span>
                  <span th:text="|조회수: ${notice.hit}|"></span>
                  <span th:if="${notice.attachmentFiles != null and !notice.attachmentFiles.isEmpty()}" th:text="|첨부파일: ${notice.attachmentFiles.size()}개|"></span>
                </div>
                <div class="flex items-center space-x-4">
                  
                  <button
                    class="flex items-center space-x-1 text-gray-500 hover:text-gray-700"
                  >
                    <i class="fas fa-share"></i>
                    <span>공유</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- Article Content -->
            <article class="prose prose-lg max-w-none">
              <div class="text-gray-800 leading-relaxed space-y-6" th:utext="${notice.content}">
              </div>
            </article>

            <!-- Attachments -->
            <div th:if="${notice.attachmentFiles != null and !notice.attachmentFiles.isEmpty()}" class="mt-8 pt-6 border-t border-gray-200">
              <h3 class="text-lg font-semibold text-gray-800 mb-4">첨부파일</h3>
              <div class="space-y-2">
                <a
                  th:each="filePath : ${notice.attachmentFiles}"
                  th:href="@{${filePath}}"
                  target="_blank"
                  class="flex items-center space-x-3 p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
                >
                  <i th:classappend="${filePath.endsWith('.pdf') ? 'fas fa-file-pdf text-red-500' : (filePath.endsWith('.jpg') || filePath.endsWith('.jpeg') || filePath.endsWith('.png') || filePath.endsWith('.gif') ? 'fas fa-file-image text-blue-500' : 'fas fa-file text-gray-500')}"></i>
                  <span th:text="${filePath.substring(filePath.lastIndexOf('/') + 1)}"></span>
                  <!-- 파일 크기는 현재 Notice 엔티티에 없으므로 표시하지 않음 -->
                  <!-- <span class="text-sm text-gray-500">(2.3MB)</span> -->
                </a>
              </div>
            </div>
          </div>

          <!-- Navigation Buttons -->
          <div class="flex justify-between items-center mt-6 mb-6 p-4 bg-white rounded-lg shadow-sm">
            <div th:if="${prevNotice}">
              <a th:href="@{/board/notice/detail/{noticeId}(noticeId=${prevNotice.noticeId})}"
                 class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                <i class="fas fa-chevron-left mr-2"></i> 이전글
              </a>
            </div>
            <div th:unless="${prevNotice}">
              <span class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-400 bg-gray-100 cursor-not-allowed">
                <i class="fas fa-chevron-left mr-2"></i> 이전글 없음
              </span>
            </div>
            <a href="/board/notice/list"
               class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-gray-800 hover:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-700">
              목록으로
            </a>
            <div th:if="${nextNotice}">
              <a th:href="@{/board/notice/detail/{noticeId}(noticeId=${nextNotice.noticeId})}"
                 class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                다음글 <i class="fas fa-chevron-right ml-2"></i>
              </a>
            </div>
            <div th:unless="${nextNotice}">
              <span class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-400 bg-gray-100 cursor-not-allowed">
                다음글 없음 <i class="fas fa-chevron-right ml-2"></i>
              </span>
            </div>
          </div>

          <!-- Related Notices -->
          <div class="bg-white rounded-lg shadow-sm p-6 mt-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">
              관련 공지사항
            </h3>
            <div th:if="${!relatedNotices.isEmpty()}" class="space-y-3">
              <a
                th:each="related : ${relatedNotices}"
                th:href="@{/board/notice/detail/{noticeId}(noticeId=${related.noticeId})}"
                class="flex items-center justify-between p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors"
              >
                <div class="flex items-center space-x-3">
                  <span
                    th:text="${related.category}"
                    th:classappend="${related.category == '이벤트' ? 'bg-blue-100 text-blue-800' : (related.category == '배송' ? 'bg-green-100 text-green-800' : (related.category == '시스템' ? 'bg-purple-100 text-purple-800' : 'bg-gray-100 text-gray-800'))}"
                    class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium"
                  >
                  </span>
                  <span class="text-gray-800" th:text="${related.title}"></span>
                </div>
                <span class="text-sm text-gray-500" th:text="${#temporals.format(related.createdAt, 'yyyy.MM.dd')}"></span>
              </a>
            </div>
            <div th:unless="${!relatedNotices.isEmpty()}" class="px-6 py-4 text-center text-gray-500">
                관련 공지사항이 없습니다.
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="mt-8 grid md:grid-cols-3 gap-4">
            <a
              href="/board/qna/list"
              class="flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
            >
              <div class="text-center">
                <i
                  class="fas fa-question-circle text-2xl text-blue-500 mb-2"
                ></i>
                <p class="font-medium text-gray-800">자주 묻는 질문</p>
                <p class="text-sm text-gray-600">FAQ에서 답변을 찾아보세요</p>
              </div>
            </a>

            <a
              href="/member/login"
              class="flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
            >
              <div class="text-center">
                <i class="fas fa-headset text-2xl text-green-500 mb-2"></i>
                <p class="font-medium text-gray-800">고객센터</p>
                <p class="text-sm text-gray-600">1:1 문의 및 상담</p>
              </div>
            </a>

            <a
              href="/shop/list"
              class="flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
            >
              <div class="text-center">
                <i
                  class="fas fa-shopping-bag text-2xl text-purple-500 mb-2"
                ></i>
                <p class="font-medium text-gray-800">쇼핑하기</p>
                <p class="text-sm text-gray-600">Rêve 상품 둘러보기</p>
              </div>
            </a>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Login Modal Fragment -->
    <div th:replace="~{fragments/modal :: loginModal}"></div>

    <div id="noticeData" style="display:none;" th:attr="data-title=${notice.title}"></div>
    <div id="noticeContentHidden" style="display:none;" th:utext="${notice.content}"></div>
    <script src="/js/script.js"></script>
    <script>
      function deleteNotice(noticeId) {
        if (confirm('정말로 이 공지사항을 삭제하시겠습니까?')) {
          $.ajax({
            url: '/admin/board/notice/' + noticeId,
            type: 'DELETE',
            success: function() {
              alert('공지사항이 삭제되었습니다.');
              window.location.href = '/board/notice/list';
            },
            error: function(xhr, status, error) {
              alert('공지사항 삭제에 실패했습니다: ' + (xhr.responseText || error));
            }
          });
        }
      }

      // Share functionality
      document
        .querySelector('button:has(.fa-share)')
        .addEventListener('click', function () {
          const noticeDataElement = document.getElementById('noticeData');
          const noticeTitle = noticeDataElement.dataset.title;

          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = document.getElementById('noticeContentHidden').innerHTML;
          const plainTextContent = tempDiv.textContent || tempDiv.innerText || '';

          if (navigator.share) {
            navigator.share({
              title: noticeTitle,
              text: plainTextContent.substring(0, Math.min(plainTextContent.length, 100)) + '...',
              url: window.location.href,
            });
          } else {
            // Fallback for browsers that don't support Web Share API
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
              alert('링크가 클립보드에 복사되었습니다.');
            });
          }
        });
    </script>
  </body>
