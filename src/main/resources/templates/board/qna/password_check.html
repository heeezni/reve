<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head}">
    <title>비밀글 비밀번호 확인 - Rêve</title>
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="pt-20">
      <div class="min-h-screen bg-gray-50 py-12 flex items-center justify-center">
        <div class="max-w-md w-full bg-white rounded-lg shadow-sm p-8">
          <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">비밀글 비밀번호 확인</h1>
          <p class="text-gray-600 text-center mb-6">이 게시글은 비밀글입니다. 비밀번호를 입력해주세요.</p>

          <form th:action="@{/board/qna/password/{qnaId}(qnaId=${qnaId})}" method="post" class="space-y-6">
            <div th:if="${errorMessage}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
              <span class="block sm:inline" th:text="${errorMessage}"></span>
            </div>
            <div>
              <label for="password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="비밀번호를 입력하세요"
                class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                required
              />
            </div>
            <button
              type="submit"
              class="w-full inline-flex items-center justify-center px-6 py-3 bg-gray-800 text-white rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent font-medium"
            >
              확인
            </button>
          </form>
        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Login Modal Fragment -->
    <div th:replace="~{fragments/modal :: loginModal}"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
