<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head}">
    <title>Q&A 상세 - Rêve</title>
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="pt-20">
      <div class="min-h-screen bg-gray-50 py-12">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
          <!-- Breadcrumb -->
          <nav class="mb-6">
            <ol class="flex items-center space-x-2 text-sm text-gray-600">
              <li><a href="/" class="hover:text-gray-800">홈</a></li>
              <li><i class="fas fa-chevron-right text-xs"></i></li>
              <li>
                <a href="/board/qna/list" class="hover:text-gray-800">Q&A</a>
              </li>
              <li><i class="fas fa-chevron-right text-xs"></i></li>
              <li class="text-gray-800">상세보기</li>
            </ol>
          </nav>

          <!-- Access Denied Message for Secret Posts -->
          <div th:if="${qna.isSecret and !isAuthor and !isAdmin}" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6" role="alert">
            <p class="font-bold">접근 권한 없음</p>
            <p>이 게시글은 비밀글입니다. 작성자 또는 관리자만 열람할 수 있습니다.</p>
          </div>

          <!-- Question Section -->
          <div th:unless="${qna.isSecret and !isAuthor and !isAdmin}" class="bg-white rounded-lg shadow-sm p-8 mb-6">
            <div class="border-b border-gray-200 pb-6 mb-6">
              <!-- Category and Status -->
              <div class="flex items-center space-x-3 mb-4">
                <span
                  class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                  th:classappend="${qna.category == 'product' ? 'bg-blue-100 text-blue-800' :
                                   (qna.category == 'delivery' ? 'bg-green-100 text-green-800' :
                                   (qna.category == 'payment' ? 'bg-purple-100 text-purple-800' :
                                   (qna.category == 'return' ? 'bg-red-100 text-red-800' :
                                   'bg-gray-100 text-gray-800')))}"
                  th:text="${qna.category == 'product' ? '상품문의' :
                             (qna.category == 'delivery' ? '배송문의' :
                             (qna.category == 'payment' ? '결제문의' :
                             (qna.category == 'return' ? '반품/교환' :
                             '기타')))}"
                >
                  <!-- Category -->
                </span>
                <span
                  class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                  th:classappend="${qna.answer != null and qna.answer.length() > 0 ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}"
                  th:text="${qna.answer != null and qna.answer.length() > 0 ? '답변완료' : '답변대기'}"
                >
                  <!-- Status -->
                </span>
                <span
                  th:if="${qna.isSecret}"
                  class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-600"
                >
                  <i class="fas fa-lock mr-1"></i>
                  비밀글
                </span>
              </div>

              <h1 class="text-2xl font-bold text-gray-800 mb-4 leading-tight"
                th:text="${qna.title}"
              >
                <!-- Title -->
              </h1>

              <!-- Question Meta -->
              <div
                class="flex items-center justify-between text-sm text-gray-600"
              >
                <div class="flex items-center space-x-6">
                  <span
                    >작성자: <span th:text="${qna.userName}"></span
                  ></span>
                  <span
                    >작성일:
                    <span
                      th:text="${#temporals.format(qna.createdAt, 'yyyy.MM.dd')}"
                    ></span
                  ></span>
                </div>
              </div>
            </div>

            <!-- Question Content -->
            <div class="mb-8">
              <h3
                class="text-lg font-semibold text-gray-800 mb-4 flex items-center"
              >
                <i class="fas fa-question-circle text-blue-500 mr-2"></i>
                문의사항
              </h3>
              <div
                class="bg-blue-50 border-l-4 border-blue-400 p-6 rounded-r-lg"
              >
                <div class="text-gray-800 leading-relaxed space-y-4">
                  <p th:text="${qna.content}"></p>
                </div>
              </div>
            </div>

            <!-- Attachments -->
            <div th:if="${qna.attachment}" class="mb-8">
              <h3 class="text-lg font-semibold text-gray-800 mb-4">첨부파일</h3>
              <div class="flex flex-wrap gap-3">
                <div
                  th:each="url : ${#strings.arraySplit(qna.attachment, ',')}"
                  class="relative w-24 h-24 border border-gray-300 rounded-md overflow-hidden flex items-center justify-center bg-gray-100"
                >
                  <a th:href="@{${url}}" target="_blank" class="block w-full h-full">
                    <img
                      th:if="${url.endsWith('.jpg') or url.endsWith('.jpeg') or url.endsWith('.png') or url.endsWith('.gif')}"
                      th:src="@{${url}}"
                      alt="첨부 이미지"
                      class="w-full h-full object-cover"
                    />
                    <div
                      th:unless="${url.endsWith('.jpg') or url.endsWith('.jpeg') or url.endsWith('.png') or url.endsWith('.gif')}"
                      class="flex flex-col items-center justify-center text-gray-500 text-xs p-1"
                    >
                      <i class="fas fa-file-alt text-3xl mb-1"></i>
                      <span
                        th:text="${#strings.substringAfterLast(url, '/')}"
                        class="text-center break-all"
                      ></span>
                    </div>
                  </a>
                </div>
              </div>
            </div>
          </div>

          <!-- Answer Form for Admin -->
          <div th:if="${isAdmin and qna.answer == null}" class="bg-white rounded-lg shadow-sm p-8 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
              <i class="fas fa-reply text-purple-500 mr-2"></i>
              답변 작성
            </h3>
            <form th:action="@{/admin/board/qna/{qnaId}/answer(qnaId=${qna.qnaId})}" method="post" class="space-y-4">
              <div>
                <label for="answerContent" class="sr-only">답변 내용</label>
                <textarea id="answerContent" name="answerContent" rows="6" class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="답변 내용을 입력하세요." required></textarea>
              </div>
              <div class="flex justify-end">
                <button type="submit" class="inline-flex items-center px-6 py-3 bg-purple-600 text-white rounded-md hover:bg-purple-700 font-medium">
                  <i class="fas fa-paper-plane mr-2"></i> 답변 등록
                </button>
              </div>
            </form>
          </div>

          <!-- Answer Section -->
          <div th:if="${qna.answer}" class="bg-white rounded-lg shadow-sm p-8 mb-6">
            <div class="mb-6">
              <h3
                class="text-lg font-semibold text-gray-800 mb-4 flex items-center"
              >
                <i class="fas fa-comment-dots text-green-500 mr-2"></i>
                답변
              </h3>
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-4">
                  <div class="flex items-center space-x-2">
                    <i class="fas fa-user-tie text-gray-600"></i>
                    <span class="text-sm font-medium text-gray-800"
                      >Rêve 고객센터</span
                    >
                  </div>
                  <span class="text-sm text-gray-500"
                    th:text="${#temporals.format(qna.updatedAt, 'yyyy.MM.dd')}"
                  ></span>
                </div>
                <div th:if="${isAdmin}" class="flex space-x-2">
                  <button type="button" onclick="editAnswer()" class="inline-flex items-center px-3 py-1 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50">
                    <i class="fas fa-edit mr-1"></i> 수정
                  </button>
                  <form th:action="@{/admin/board/qna/{qnaId}/answer(qnaId=${qna.qnaId})}" method="post" onsubmit="return confirm('답변을 삭제하시겠습니까?');">
                    <input type="hidden" name="_method" value="delete" />
                    <button type="submit" class="inline-flex items-center px-3 py-1 bg-red-500 text-white rounded-md hover:bg-red-600 text-sm font-medium">
                      <i class="fas fa-trash-alt mr-1"></i> 삭제
                    </button>
                  </form>
                </div>
              </div>
            </div>

            <div
              class="bg-green-50 border-l-4 border-green-400 p-6 rounded-r-lg"
            >
              <div class="text-gray-800 leading-relaxed space-y-4">
                <p id="answerContentDisplay" th:text="${qna.answer}"></p>
              </div>
            </div>
          </div>

          <!-- Answer Form for Admin (Edit Mode) -->
          <div id="answerEditForm" th:if="${isAdmin and qna.answer != null}" style="display:none;" class="bg-white rounded-lg shadow-sm p-8 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
              <i class="fas fa-reply text-purple-500 mr-2"></i>
              답변 수정
            </h3>
            <form id="answerForm" th:action="@{/admin/board/qna/{qnaId}/answer(qnaId=${qna.qnaId})}" method="post" class="space-y-4">
              <input type="hidden" name="_method" value="put" />
              <div>
                <label for="answerContentEdit" class="sr-only">답변 내용</label>
                <textarea id="answerContentEdit" name="answerContent" rows="6" class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent" required></textarea>
              </div>
              <div class="flex justify-end space-x-2">
                <button type="button" onclick="cancelEdit()" class="inline-flex items-center px-6 py-3 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 font-medium">취소</button>
                <button type="submit" class="inline-flex items-center px-6 py-3 bg-purple-600 text-white rounded-md hover:bg-purple-700 font-medium">
                  <i class="fas fa-save mr-2"></i> 답변 저장
                </button>
              </div>
            </form>
          </div>

          <!-- Navigation Buttons -->
          <div class="flex items-center justify-between mb-8">
            <a
              href="/board/qna/list"
              class="flex items-center space-x-2 px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
            >
              <i class="fas fa-list"></i>
              <span>목록으로</span>
            </a>

            <div class="flex items-center space-x-2">
              <!-- 수정 버튼 -->
              <a
                th:if="${(isAuthor != null && isAuthor) || (isAdmin != null && isAdmin)}"
                th:href="@{/board/qna/edit/{qnaId}(qnaId=${qna.qnaId})}"
                class="inline-flex items-center px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors font-medium text-sm"
              >
                <i class="fas fa-edit mr-2"></i>
                수정
              </a>

              <!-- 삭제 버튼 -->
              <form
                th:if="${(isAuthor != null && isAuthor) || (isAdmin != null && isAdmin)}"
                th:action="@{/board/qna/{qnaId}(qnaId=${qna.qnaId})}"
                th:method="post"
                style="display: inline;"
                onsubmit="return confirm('정말로 이 Q&A를 삭제하시겠습니까?');"
              >
                <input type="hidden" name="_method" value="delete" />
                <button
                  type="submit"
                  class="inline-flex items-center px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors font-medium text-sm"
                >
                  <i class="fas fa-trash-alt mr-2"></i>
                  삭제
                </button>
              </form>

              <a
                th:if="${qna.prevQnaId}"
                th:href="@{/board/qna/detail/{qnaId}(qnaId=${qna.prevQnaId})}"
                class="flex items-center space-x-2 px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
              >
                <i class="fas fa-chevron-left"></i>
                <span>이전글</span>
              </a>
              <button
                th:unless="${qna.prevQnaId}"
                class="flex items-center space-x-2 px-4 py-2 border border-gray-300 rounded-md text-gray-400 cursor-not-allowed"
                disabled
              >
                <i class="fas fa-chevron-left"></i>
                <span>이전글</span>
              </button>

              <a
                th:if="${qna.nextQnaId}"
                th:href="@{/board/qna/detail/{qnaId}(qnaId=${qna.nextQnaId})}"
                class="flex items-center space-x-2 px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors"
              >
                <span>다음글</span>
                <i class="fas fa-chevron-right"></i>
              </a>
              <button
                th:unless="${qna.nextQnaId}"
                class="flex items-center space-x-2 px-4 py-2 border border-gray-300 rounded-md text-gray-400 cursor-not-allowed"
                disabled
              >
                <span>다음글</span>
                <i class="fas fa-chevron-right"></i>
              </button>
            </div>
          </div>

          <!-- Quick Actions -->
          <div class="mt-8 grid md:grid-cols-3 gap-4">
            <a
              href="/board/qna/form"
              class="flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
            >
              <div class="text-center">
                <i class="fas fa-pen text-2xl text-blue-500 mb-2"></i>
                <p class="font-medium text-gray-800">새 문의하기</p>
                <p class="text-sm text-gray-600">궁금한 점을 문의해보세요</p>
              </div>
            </a>

            <a
              href="/board/qna/list"
              class="flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
            >
              <div class="text-center">
                <i class="fas fa-list text-2xl text-green-500 mb-2"></i>
                <p class="font-medium text-gray-800">Q&A 목록</p>
                <p class="text-sm text-gray-600">
                  다른 문의사항도 확인해보세요
                </p>
              </div>
            </a>

            <a
              href="/member/login"
              class="flex items-center justify-center p-4 bg-white rounded-lg shadow-sm hover:shadow-md transition-shadow"
            >
              <div class="text-center">
                <i class="fas fa-headset text-2xl text-purple-500 mb-2"></i>
                <p class="font-medium text-gray-800">고객센터</p>
                <p class="text-sm text-gray-600">1:1 문의 및 상담</p>
              </div>
            </a>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Login Modal Fragment -->
    <div th:replace="~{fragments/modal :: loginModal}"></div>

    <script src="/js/script.js"></script>
    <script th:inline="javascript">
      // File download simulation (for non-image attachments)
      document.querySelectorAll('a[href^="/uploads/"]').forEach((link) => {
        // th:href 속성이 /uploads/로 시작하는 링크에만 이벤트 리스너 추가
        link.addEventListener('click', function (e) {
          const url = this.getAttribute('href');
          const fileName = url.substring(url.lastIndexOf('/') + 1);
          // 실제 다운로드 로직 대신 시뮬레이션 메시지 표시
          alert(`${fileName} 다운로드를 시작합니다.`);
          // 실제 다운로드를 원하면 e.preventDefault()를 제거하고 서버에서 파일 스트리밍 로직 구현 필요
        });
      });

      function editAnswer() {
        const answerDisplay = document.querySelector('.bg-green-50.border-l-4');
        const answerEditForm = document.getElementById('answerEditForm');
        const answerContentEdit = document.getElementById('answerContentEdit');
        const answerContentDisplay = document.getElementById('answerContentDisplay');

        if (answerDisplay && answerEditForm && answerContentEdit && answerContentDisplay) {
          answerDisplay.style.display = 'none';
          answerEditForm.style.display = 'block';
          answerContentEdit.value = answerContentDisplay.innerText;
        }
      }

      function cancelEdit() {
        const answerDisplay = document.querySelector('.bg-green-50.border-l-4');
        const answerEditForm = document.getElementById('answerEditForm');

        if (answerDisplay && answerEditForm) {
          answerDisplay.style.display = 'block';
          answerEditForm.style.display = 'none';
        }
      }
    </script>
  </body>
</html>
