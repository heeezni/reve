<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='장바구니 | Rêve')}"></head>
<body class="font-sans text-gray-800">
<!-- Header Fragment -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Main Content -->
<main class="pt-20">
  <div class="min-h-screen bg-gray-50 py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <!-- Page Title -->
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">장바구니</h1>
        <p class="text-gray-600">선택하신 상품들을 확인하고 주문해보세요</p>
      </div>

      <div class="grid lg:grid-cols-3 gap-8">
        <!-- Cart Items -->
        <div class="lg:col-span-2">
          <div class="bg-white rounded-lg shadow-sm">
            <!-- Cart Header -->
            <div class="p-6 border-b border-gray-200">
              <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold text-gray-800">상품 목록</h2>
                <form id="deleteAllForm" action="/cart/deleteAll" method="post">
                  <button type="submit" id="deleteAllBtn">전체 삭제</button>
                </form>
              </div>
            </div>

            <!-- Cart Items List -->
            <div id="cartItemsList" class="divide-y divide-gray-200">
              <div th:each="cartItem : ${cartItems}" class="p-6">
                <div class="flex items-center space-x-4">
                  <!-- Checkbox -->
                  <label>
                    <input
                            type="checkbox"
                            class="w-4 h-4 text-gray-800 border-gray-300 rounded focus:ring-gray-800"
                            checked
                    />
                  </label>

                  <!-- Product Image -->
                  <div class="flex-shrink-0">
                    <img
                            th:src="@{${cartItem.perfume.imageUrl}}"
                            th:alt="${cartItem.perfume.perfumeName}"
                            class="w-20 h-20 object-cover rounded-md"
                    />
                  </div>

                  <!-- Product Info -->
                  <div class="flex-1 min-w-0">
                    <h3 class="text-sm font-medium text-gray-800 truncate" th:text="${cartItem.perfume.perfumeName}"></h3>
                    <p class="text-sm text-gray-500" th:text="${cartItem.perfume.volume}"></p>
                    <div class="flex items-center mt-1">
                      <span class="text-red-500 font-bold text-sm"
                            th:text="|${T(java.lang.Math).round((cartItem.perfume.discount * 100.0) / cartItem.perfume.price)}%할인|"></span>
                      <span
                              class="text-lg font-bold ml-2 price-per-item"
                              th:text="${cartItem.perfume.price - cartItem.perfume.discount} + '원'">
                      </span>
                      <span class="text-gray-400 line-through text-sm ml-2"
                            th:text="|${#numbers.formatInteger(cartItem.perfume.price, 3, 'COMMA')}원|"></span>
                    </div>
                  </div>

                  <!-- 수량 컨트롤 + 경고 메시지 묶는 래퍼 -->
                  <div class="flex flex-col items-start space-y-1">

                    <!-- 수량 컨트롤 라인 -->
                    <div class="flex items-center space-x-2">
                      <button
                              type="button"
                              class="qty-btn minus w-8 h-8 border border-gray-300 rounded-md flex items-center justify-center hover:bg-gray-50"
                      >
                        <i class="fas fa-minus text-xs"></i>
                      </button>
                      <input
                              type="text"
                              th:value="${cartItem.quantity}"
                              min="1"
                              class="qty-input w-20 h-8 border border-gray-300 rounded-md text-center text-sm"
                              autocomplete="off"
                              th:attr="data-stock=${cartItem.perfume.stock}"
                      />
                      <button
                              type="button"
                              class="qty-btn plus w-8 h-8 border border-gray-300 rounded-md flex items-center justify-center hover:bg-gray-50"
                      >
                        <i class="fas fa-plus text-xs"></i>
                      </button>
                    </div>

                    <!-- 재고 경고 메시지 -->
                    <p class="stock-warning text-sm text-red-500 hidden">재고 수량을 초과할 수 없습니다.</p>

                  </div>

                  <!-- Actions -->
                  <div class="flex flex-col items-end space-y-2">
                    <button class="delete-item-btn text-gray-400 hover:text-gray-600"
                            th:attr="data-cart-id=${cartItem.cartId}">
                      <i class="fas fa-trash text-sm"></i>
                    </button>
                    <div class="text-right">
                      <p class="text-lg font-bold text-gray-800 item-total-price"
                         th:text="|${(cartItem.perfume.price - cartItem.perfume.discount) * cartItem.quantity}원|"></p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Empty Cart State -->
            <div id="emptyCartState" class="p-12 text-center" style="display:none;">
              <!-- 빈 장바구니 영역 -->
              <i class="fas fa-shopping-cart text-4xl text-gray-300 mb-4"></i>
              <h3 class="text-lg font-medium text-gray-800 mb-2">장바구니가 비어있습니다</h3>
              <p class="text-gray-500 mb-6">원하시는 상품을 장바구니에 담아보세요</p>
              <a href="/shop/list" class="inline-block bg-gray-800 text-white py-2 px-6 rounded-md hover:bg-gray-700 transition-colors">쇼핑 계속하기</a>
            </div>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="lg:col-span-1">
          <div class="bg-white rounded-lg shadow-sm p-6 sticky top-8">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">주문 요약</h2>

            <!-- Price Breakdown -->
            <div class="space-y-3 mb-6">
              <div class="flex justify-between text-sm">
                <span class="text-gray-600">상품 금액</span>
                <span id="summaryTotalPrice" th:text="totalPrice + '원'"></span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-red-500">할인 금액</span>
                <span id="summaryDiscountAmount" class="text-red-500" th:text="'-' + discountAmount + '원'"></span>
              </div>
              <div class="flex justify-between text-sm">
                <span class="text-gray-600">배송비</span>
                <span id="summaryDeliveryFee" class="text-gray-800"
                      th:text="${deliveryFee == 0 ? '무료' : deliveryFee + '원'}"></span>
              </div>
              <div class="border-t pt-3">
                <div class="flex justify-between text-lg font-bold">
                  <span>총 결제금액</span>
                  <span id="summaryTotalPayment" class="text-gray-800" th:text="totalPayment + '원'"></span>
                </div>
              </div>
            </div>

            <!-- Coupon Section -->
            <div class="mb-6">
              <h3 class="text-sm font-medium text-gray-700 mb-2">쿠폰/포인트</h3>
              <div class="space-y-2">
                <label>
                  <select class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent">
                    <option>쿠폰을 선택하세요</option>
                    <option>신규가입 10% 할인</option>
                    <option>무료배송 쿠폰</option>
                  </select>
                </label>
                <label>
                  <input
                          type="text"
                          placeholder="포인트 사용 (보유: 1,000P)"
                          class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                  />
                </label>
              </div>
            </div>

            <!-- Checkout Buttons -->
            <div class="space-y-3">
              <button class="w-full bg-gray-800 text-white py-3 px-6 rounded-md hover:bg-gray-700 transition-colors font-medium">선택 상품 주문</button>
              <button class="w-full border border-gray-300 text-gray-700 py-3 px-6 rounded-md hover:bg-gray-50 transition-colors font-medium">전체 상품 주문</button>
            </div>

            <!-- Additional Info -->
            <div class="mt-6 pt-6 border-t border-gray-200">
              <div class="text-xs text-gray-500 space-y-1">
                <p>• 무료배송 기준: 50,000원 이상 구매 시</p>
                <p>• 배송 예정일: 결제 완료 후 1-2일 내</p>
                <p>• 반품/교환: 배송 완료 후 7일 이내</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Related Products (여기선 콤마 유지해도 괜찮으면 그냥 냅둬도 됨) -->
      <div class="mt-12">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">함께 구매하면 좋은 상품</h2>
        <div class="grid md:grid-cols-4 gap-6">
          <div th:each="perfume : ${recommendedPerfumes}" class="bg-white rounded-lg shadow p-4 group">
            <a th:href="@{/shop/detail(id=${perfume.perfumeId})}" class="block">
              <!-- 이미지 영역 (hover 효과 적용됨) -->
              <div class="relative w-full h-48 overflow-hidden rounded-md mb-2">
                <!-- 기본 이미지 -->
                <img th:src="@{${perfume.imageUrl}}" th:alt="${perfume.perfumeName}"
                     class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 opacity-100 group-hover:opacity-0" />

                <!-- 호버 이미지 -->
                <img th:src="@{${perfume.hoverImageUrl}}" th:alt="${perfume.perfumeName} + ' (hover)'"
                     class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 opacity-0 group-hover:opacity-100" />
              </div>

              <!-- 향수 이름 -->
              <h3 class="text-lg font-semibold text-gray-800" th:text="${perfume.perfumeName}"></h3>

              <!-- 향 설명 -->
              <p
                      th:text="${perfume.scent}"
                      th:classappend="
                        ${perfume.scent} == '플로럴' ? ' bg-pink-100 text-pink-800 px-2 py-0.5 rounded-full text-xs font-semibold inline-block' :
                        (${perfume.scent} == '시트러스' ? ' bg-green-100 text-green-800 px-2 py-0.5 rounded-full text-xs font-semibold inline-block' :
                        (${perfume.scent} == '우디' ? ' bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full text-xs font-semibold inline-block' :
                        (${perfume.scent} == '머스크' ? ' bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded-full text-xs font-semibold inline-block' : ' bg-gray-100 text-gray-800 px-2 py-0.5 rounded-full text-xs font-semibold inline-block')))
                      "
              ></p>
            </a>

            <!-- 가격 정보 -->
            <div class="mt-2 flex items-center space-x-2">
              <!-- 할인율 -->
              <span class="text-red-600 text-sm font-bold"
                    th:text="${T(java.lang.Math).round((perfume.discount * 100.0) / perfume.price)} + '%할인'">
              </span>

              <!-- 할인된 가격 -->
              <span class="text-black-500 font-bold text-lg"
                    th:text="${#numbers.formatInteger(perfume.price - perfume.discount, 3, 'COMMA')} + '원'">
              </span>

              <!-- 원가 -->
              <span class="text-gray-400 line-through text-sm"
                    th:text="${#numbers.formatInteger(perfume.price, 3, 'COMMA')} + '원'">
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Footer Fragment -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Login Modal Fragment -->
<div th:replace="~{fragments/modal :: loginModal}"></div>

<script src="/js/script.js"></script>
<script>
  // 천 단위 콤마 포맷 함수
  function formatNumberWithComma(value) {
    return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  // 숫자만 추출하는 함수
  function extractNumber(value) {
    return value.toString().replace(/[^0-9]/g, '');
  }

  // 수량 input 포맷 및 계산 업데이트
  function onQtyInputChange(input) {
    const maxStock = parseInt(input.dataset.stock, 10);
    let cursorPos = input.selectionStart;
    const originalLength = input.value.length;

    let numStr = extractNumber(input.value);
    if(numStr === '') numStr = '1';

    let num = parseInt(numStr, 10);
    if (num < 1) num = 1;

    const warningElem = input.parentElement.parentElement.querySelector('.stock-warning');

    if (num > maxStock) {
      if (warningElem) warningElem.classList.remove('hidden');
      num = maxStock; // 자동으로 재고 수량으로 맞춤
    } else {
      if (warningElem) warningElem.classList.add('hidden');
    }

    input.value = num.toString();

    const newLength = input.value.length;
    cursorPos += newLength - originalLength;
    input.setSelectionRange(cursorPos, cursorPos);

    updateItemTotal(input);
  }

  // 버튼 클릭 시 수량 변경
  function changeQty(input, delta) {
    const maxStock = parseInt(input.dataset.stock, 10);
    let numStr = extractNumber(input.value);
    let num = parseInt(numStr, 10) || 1;

    num += delta;
    if (num < 1) num = 1;

    const warningElem = input.parentElement.parentElement.querySelector('.stock-warning');

    if (num > maxStock) {
      if (warningElem) {
        warningElem.classList.remove('hidden');
      }
      return; // 재고 초과 시 수량 업데이트 안 함
    } else {
      if (warningElem) {
        warningElem.classList.add('hidden');
      }
    }

    input.value = num.toString();
    updateItemTotal(input);
  }

  // 개별 아이템 총 가격 업데이트
  function updateItemTotal(input) {
    const itemContainer = input.closest('.p-6');
    const quantity = parseInt(extractNumber(input.value), 10);
    const pricePerItemText = itemContainer.querySelector('.price-per-item').textContent;
    const pricePerItem = parseInt(extractNumber(pricePerItemText), 10);

    const totalElement = itemContainer.querySelector('.item-total-price');
    totalElement.textContent = formatNumberWithComma(quantity * pricePerItem) + '원';

    updateOrderSummary();
  }

  // 전체 주문 요약 업데이트
  function updateOrderSummary() {
    let totalOriginalPrice = 0; // 할인 전 가격 총합
    let totalDiscount = 0; // 할인 금액 총합

    document.querySelectorAll('.divide-y > div').forEach(item => {
      const checkbox = item.querySelector('input[type="checkbox"]');
      if (checkbox && checkbox.checked) {
        const qtyInput = item.querySelector('.qty-input');
        const quantity = parseInt(extractNumber(qtyInput.value), 10);

        const originalPriceText = item.querySelector('.line-through').textContent;
        const discountPriceText = item.querySelector('.price-per-item').textContent;

        const originalPrice = parseInt(extractNumber(originalPriceText), 10);
        const discountPrice = parseInt(extractNumber(discountPriceText), 10);
        const discountAmount = originalPrice - discountPrice;

        totalOriginalPrice += originalPrice * quantity;
        totalDiscount += discountAmount * quantity;
      }
    });

    // 전체 삭제 버튼
    document.getElementById('deleteAllForm').addEventListener('submit', (e) => {
      if (!confirm('정말 전체 삭제하시겠습니까?')) {
        e.preventDefault(); // 취소하면 폼 제출 막기
      }
    });

    // 휴지통으로 삭제 버튼(비동기 방식)
    document.querySelectorAll('.delete-item-btn').forEach(button => {
      button.addEventListener('click', async () => {
        const cartId = button.getAttribute('data-cart-id');

        try {
          const response = await fetch(`/cart/${cartId}`, {
            method: 'DELETE'
          });

          if (response.ok) {
            const itemElement = button.closest('.p-6');
            if (itemElement) {
              itemElement.remove();
            }
            updateOrderSummary();

            toggleEmptyCartState();
          } else {
            console.error('삭제 실패: 서버 응답 오류', response.status);
          }
        } catch (error) {
          console.error('삭제 중 오류 발생:', error);
        }
      });
    });

    // 할인된 가격
    const totalPriceAfterDiscount = totalOriginalPrice - totalDiscount;

    // 배송비 계산
    const deliveryFee = totalPriceAfterDiscount >= 50000 ? 0 : 3000;

    // 최종 결제 금액
    const totalPayment = totalOriginalPrice - totalDiscount + deliveryFee;

    // DOM 업데이트
    document.getElementById('summaryTotalPrice').textContent = formatNumberWithComma(totalOriginalPrice) + '원';
    document.getElementById('summaryDiscountAmount').textContent = '-' + formatNumberWithComma(totalDiscount) + '원';
    document.getElementById('summaryDeliveryFee').textContent = deliveryFee === 0 ? '무료' : formatNumberWithComma(deliveryFee) + '원';
    document.getElementById('summaryTotalPayment').textContent = formatNumberWithComma(totalPayment) + '원';
  }

  function toggleEmptyCartState() {
    const cartItemsList = document.getElementById('cartItemsList');
    const emptyCartState = document.getElementById('emptyCartState');

    // 자식 요소가 없거나, 자식 수가 0이면 빈 상태로
    if (!cartItemsList || cartItemsList.children.length === 0) {
      if (cartItemsList) cartItemsList.style.display = 'none';
      if (emptyCartState) emptyCartState.style.display = 'block';
    } else {
      if (cartItemsList) cartItemsList.style.display = 'block';
      if (emptyCartState) emptyCartState.style.display = 'none';
    }
  }

  // 이벤트 리스너 등록
  document.querySelectorAll('.qty-input').forEach(input => {
    input.addEventListener('input', () => onQtyInputChange(input));
    // 초기값 콤마 제거 후 세팅
    input.value = extractNumber(input.value);
  });

  document.querySelectorAll('.qty-btn.plus').forEach(button => {
    button.addEventListener('click', () => {
      const input = button.parentElement.querySelector('.qty-input');
      changeQty(input, 1);
    });
  });

  document.querySelectorAll('.qty-btn.minus').forEach(button => {
    button.addEventListener('click', () => {
      const input = button.parentElement.querySelector('.qty-input');
      changeQty(input, -1);
    });
  });

  // 체크박스 변경 시 요약 업데이트
  document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
    checkbox.addEventListener('change', updateOrderSummary);
  });

  // 페이지 로드 시 초기 계산 실행
  window.addEventListener('DOMContentLoaded', () => {
    updateOrderSummary();
    toggleEmptyCartState();

    document.querySelectorAll('.price-per-item').forEach(el => {
      const num = extractNumber(el.textContent);
      el.textContent = formatNumberWithComma(num) + '원';
    });

    document.querySelectorAll('.item-total-price').forEach(el => {
      const num = extractNumber(el.textContent);
      el.textContent = formatNumberWithComma(num) + '원';
    });
  });
</script>
</body>
</html>
