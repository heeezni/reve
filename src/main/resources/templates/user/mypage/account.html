<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head(title='회원정보 | Rêve')}">
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="pt-20">
      <div class="min-h-screen bg-gray-50 py-12">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
          <!-- Breadcrumb -->
          <nav class="mb-6">
            <ol class="flex items-center space-x-2 text-sm text-gray-600">
              <li><a href="/" class="hover:text-gray-800">홈</a></li>
              <li><i class="fas fa-chevron-right text-xs"></i></li>
              <li>
                <a href="/mypage" class="hover:text-gray-800">마이페이지</a>
              </li>
              <li><i class="fas fa-chevron-right text-xs"></i></li>
              <li class="text-gray-800">회원정보</li>
            </ol>
          </nav>

          <!-- Page Title -->
          <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">회원정보</h1>
            <p class="text-gray-600">개인정보를 안전하게 관리하세요</p>
          </div>

          <!-- Account Management Tabs -->
          <div class="bg-white rounded-lg shadow-sm">
            <!-- Tab Navigation -->
            <div class="border-b border-gray-200">
              <nav class="flex space-x-8 px-8">
                <button
                  class="tab-btn py-4 px-1 border-b-2 border-gray-800 text-gray-800 font-medium text-sm"
                  data-tab="profile"
                >
                  기본정보
                </button>
                <button
                  class="tab-btn py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium text-sm"
                  data-tab="password"
                >
                  비밀번호 변경
                </button>
                <button
                  class="tab-btn py-4 px-1 border-b-2 border-transparent text-gray-500 hover:text-gray-700 font-medium text-sm"
                  data-tab="privacy"
                >
                  개인정보 설정
                </button>
              </nav>
            </div>

            <!-- Tab Content -->
            <div class="p-8">
              <!-- Profile Tab -->
              <div id="profile" class="tab-content">
                <div class="space-y-8">
                  <form th:action="@{/mypage/account/profile}" method="post" id="updateForm" enctype="multipart/form-data">
                  <!-- Profile Image -->
                  <div>
                    <label class="block text-sm font-medium text-gray-700 mb-4"
                      >프로필 이미지</label
                    >
                    <div class="flex items-center space-x-6">
                      <div class="w-24 h-24 rounded-full overflow-hidden">
                        <img th:if="${profile.profileUrl != null}" th:src="@{${profile.profileUrl}}"
                            alt="프로필 이미지"
                            id="profilePreview"
                            class="w-full h-full object-cover rounded-full border" />
                        <div th:if="${profile.profileUrl == null}" class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center"
                          id="defaultIcon">
                          <i  class="fas fa-user text-3xl text-gray-400"></i>
                        </div>
                      </div>

                      <div class="space-y-3">
                        <input type="file" id="profileImageInput" name="profileImage" accept=".jpg,.png" class="hidden" />
                        <button
                                type="button"
                                id="bt_profile"
                          class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors text-sm"
                        >
                          이미지 변경
                        </button>
                        <p class="text-sm text-gray-500">
                          JPG, PNG 파일만 업로드 가능 (최대 5MB)
                        </p>
                      </div>
                    </div>
                  </div>

                  <!-- Basic Information -->
                  <div class="space-y-6">
                    <h3 class="text-lg font-semibold text-gray-800">
                      기본 정보
                    </h3>

                    <div class="grid md:grid-cols-2 gap-6">
                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-2"
                        >
                          이름 <span class="text-red-500">*</span>
                        </label>
                        <label>
                          <input
                            type="text"
                            name="name"
                            th:value="${profile.name}"
                            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                          />
                        </label>
                      </div>

                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-2"
                        >
                          닉네임
                        </label>
                        <label>
                          <input
                            type="text"
                            name="nickname"
                            th:value="${profile.nickname != null ? profile.nickname : ''}"
                            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                          />
                        </label>
                      </div>

                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-2"
                        >
                          이메일 <span class="text-red-500">*</span>
                        </label>
                        <label>
                          <input
                            type="email"
                            th:value="${#authentication.principal.email}"
                            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                            readonly
                          />
                        </label>
                        <p class="text-sm text-gray-500 mt-1">
                          이메일은 변경할 수 없습니다
                        </p>
                      </div>

                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-2"
                        >
                          생년월일
                        </label>
                        <label>
                          <input
                            type="date"
                            name="birthday"
                            th:value="${profile != null} ? ${profile.birthday} : ''"
                            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                          />
                        </label>
                      </div>
                    </div>
                  </div>

                  <!-- Contact Information -->
                  <div class="space-y-6">
                    <h3 class="text-lg font-semibold text-gray-800">
                      연락처 정보
                    </h3>

                    <div class="grid md:grid-cols-2 gap-6">
                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-2"
                        >
                          휴대전화 <span class="text-red-500">*</span>
                        </label>
                        <div class="flex space-x-2">
                          <label>
                            <input
                              type="tel"
                              name="phone"
                              th:value="${profile.phone}"
                              class="flex-1 border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                            />
                          </label>
                          <button
                            type="button"
                            id="bt_phone"
                            class="px-4 py-3 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors text-sm whitespace-nowrap"
                          >
                            인증
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- Save Button -->
                  <div class="flex justify-end pt-6 border-t border-gray-200">
                    <button
                      type="submit"
                      id="bt_update"
                      class="px-6 py-3 bg-gray-800 text-white rounded-md hover:bg-gray-700 transition-colors font-medium"
                    >
                      정보 수정
                    </button>
                  </div>
                  </form>
                </div>
              </div>

              <!-- Password Tab -->
              <div id="password" class="tab-content hidden">
                <div class="space-y-8">
                  <div class="max-w-md">
                    <h3 class="text-lg font-semibold text-gray-800 mb-6">
                      비밀번호 변경
                    </h3>
                    <div class="space-y-6">
                      <form th:action="@{/mypage/account/password}" method="post" id="passwordForm">
                        <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-2"
                        >
                          현재 비밀번호 <span class="text-red-500">*</span>
                        </label>
                        <label>
                          <input
                            type="password"
                            name="password"
                            id="curPw"
                            placeholder="현재 비밀번호를 입력하세요"
                            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                          />
                        </label>
                      </div>

                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-2"
                        >
                          새 비밀번호 <span class="text-red-500">*</span>
                        </label>
                        <label>
                          <input
                            type="password"
                            name="newPassword"
                            id="newPw"
                            placeholder="새 비밀번호를 입력하세요"
                            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                          />
                        </label>
                        <p class="text-sm text-gray-500 mt-1">
                          영문 대소문자, 숫자, 특수문자 중 2가지 이상 조합,
                          10~16자
                        </p>
                      </div>

                      <div>
                        <label
                          class="block text-sm font-medium text-gray-700 mb-2"
                        >
                          새 비밀번호 확인 <span class="text-red-500">*</span>
                        </label>
                        <label>
                          <input
                            type="password"
                            placeholder="새 비밀번호를 다시 입력하세요"
                            id="confirmPw"
                            class="w-full border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                          />
                        </label>
                      </div>

                      <div class="pt-6">
                        <button
                          type="submit"
                          id="bt_password"
                          class="w-full px-6 py-3 bg-gray-800 text-white rounded-md hover:bg-gray-700 transition-colors font-medium"
                        >
                          비밀번호 변경
                        </button>
                      </div>
                      </form>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Privacy Tab -->
              <div id="privacy" class="tab-content hidden">
                <div class="space-y-8">
                  <h3 class="text-lg font-semibold text-gray-800">
                    개인정보 설정
                  </h3>

                  <div class="space-y-6">
                    <div class="bg-gray-50 p-6 rounded-lg">
                      <h4 class="font-medium text-gray-800 mb-4">
                        마케팅 정보 수신
                      </h4>
                      <div class="space-y-4">
                        <label class="flex items-center">
                          <input
                            type="checkbox"
                            checked
                            class="w-4 h-4 text-gray-800 border-gray-300 rounded focus:ring-gray-800"
                          />
                          <span class="ml-3 text-sm text-gray-700"
                            >SMS 수신 동의</span
                          >
                        </label>
                        <label class="flex items-center">
                          <input
                            type="checkbox"
                            checked
                            class="w-4 h-4 text-gray-800 border-gray-300 rounded focus:ring-gray-800"
                          />
                          <span class="ml-3 text-sm text-gray-700"
                            >이메일 수신 동의</span
                          >
                        </label>
                        <label class="flex items-center">
                          <input
                            type="checkbox"
                            class="w-4 h-4 text-gray-800 border-gray-300 rounded focus:ring-gray-800"
                          />
                          <span class="ml-3 text-sm text-gray-700"
                            >앱 푸시 알림 동의</span
                          >
                        </label>
                      </div>
                    </div>

                    <div class="bg-gray-50 p-6 rounded-lg">
                      <h4 class="font-medium text-gray-800 mb-4">
                        개인정보 제공
                      </h4>
                      <div class="space-y-4">
                        <label class="flex items-center">
                          <input
                            type="checkbox"
                            checked
                            class="w-4 h-4 text-gray-800 border-gray-300 rounded focus:ring-gray-800"
                          />
                          <span class="ml-3 text-sm text-gray-700"
                            >개인정보 제3자 제공 동의</span
                          >
                        </label>
                        <p class="text-sm text-gray-600">
                          서비스 제공을 위해 필요한 최소한의 개인정보만
                          제공됩니다.
                        </p>
                      </div>
                    </div>

                    <div class="pt-6">
                      <button
                        class="px-6 py-3 bg-gray-800 text-white rounded-md hover:bg-gray-700 transition-colors font-medium"
                      >
                        설정 저장
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Account Actions -->
          <div class="mt-8 bg-white rounded-lg shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">계정 관리</h3>
            <div class="space-y-4">
              <div
                class="flex items-center justify-between p-4 border border-gray-200 rounded-lg"
              >
                <div>
                  <h4 class="font-medium text-gray-800">회원 탈퇴</h4>
                  <p class="text-sm text-gray-600">
                    계정을 영구적으로 삭제합니다
                  </p>
                </div>
                <button
                  class="px-4 py-2 border border-red-300 text-red-600 rounded-md hover:bg-red-50 transition-colors text-sm"
                >
                  탈퇴하기
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Login Modal Fragment -->
    <script src="/js/script.js"></script>
    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 프로필 이미지 미리보기
        document.getElementById("profileImageInput")?.addEventListener("change", function () {
          const file = this.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              const previewImg = document.getElementById("profilePreview");
              const defaultIcon = document.getElementById("defaultIcon");
              if (previewImg) {
                previewImg.src = e.target.result;
              } else {
                const newImg = document.createElement("img");
                newImg.id = "profilePreview";
                newImg.src = e.target.result;
                newImg.className = "w-full h-full object-cover rounded-full border";
                defaultIcon?.replaceWith(newImg);
              }
            };
            reader.readAsDataURL(file);
          }
        });

        // 프로필 이미지 클릭 → input 트리거
        document.getElementById("bt_profile")?.addEventListener("click", function () {
          this.previousElementSibling.click();
        });

        // 이름, 전화번호 유효성 검사
        const nameInput = document.querySelector('input[name="name"]');
        const phoneInput = document.querySelector('input[name="phone"]');
        const updateForm = document.getElementById("updateForm");

        function showError(input, message) {
          clearError(input);
          const msg = document.createElement("p");
          msg.className = "text-red-500 text-sm mt-1 error-msg";
          msg.innerText = message;
          input.insertAdjacentElement("afterend", msg);
        }

        function clearError(input) {
          const next = input.nextElementSibling;
          if (next && next.classList.contains("error-msg")) {
            next.remove();
          }
        }

        nameInput?.addEventListener("input", function () {
          const value = this.value;
          clearError(this);
          if (!/^[가-힣a-zA-Z]+$/.test(value)) {
            showError(this, "이름은 문자만 입력 가능합니다.");
          } else if (value.length >= 10) {
            showError(this, "이름은 10자 미만으로 입력해주세요.");
          }
        });

        phoneInput?.addEventListener("input", function () {
          const value = this.value;
          clearError(this);
          if (!/^\d*$/.test(value)) {
            showError(this, "숫자만 입력 가능합니다.");
          } else if (value.length < 7 || value.length > 11) {
            showError(this, "휴대전화는 7~11자리 숫자여야 합니다.");
          }
        });

        updateForm?.addEventListener("submit", function (e) {
          const nameValid = /^[가-힣a-zA-Z]{1,9}$/.test(nameInput.value);
          const phoneValid = /^\d{7,11}$/.test(phoneInput.value);

          clearError(nameInput);
          clearError(phoneInput);

          if (!nameValid) showError(nameInput, "이름은 문자만, 10자 미만이어야 합니다.");
          if (!phoneValid) showError(phoneInput, "휴대전화는 7~11자리 숫자만 가능합니다.");

          if (!nameValid || !phoneValid) {
            e.preventDefault();
            return;
          }

          alert("정보가 성공적으로 수정되었습니다.");
        });

        // 비밀번호 변경 유효성 검사
        const passwordForm = document.getElementById("passwordForm");
        const currentInput = passwordForm?.querySelector('input[name="password"]');
        const newInput = passwordForm?.querySelector('input[name="newPassword"]');
        const confirmInput = passwordForm?.querySelector('input[placeholder="새 비밀번호를 다시 입력하세요"]');

        function createMessageEl(input) {
          let msg = input.nextElementSibling;
          if (!msg || !msg.classList.contains("error-msg")) {
            msg = document.createElement("div");
            msg.className = "text-red-500 text-sm mt-1 error-msg";
            input.insertAdjacentElement("afterend", msg);
          }
          return msg;
        }

        function validateNewPassword(value) {
          const hasLower = /[a-z]/.test(value);
          const hasUpper = /[A-Z]/.test(value);
          const hasDigit = /\d/.test(value);
          const hasSpecial = /[^a-zA-Z0-9]/.test(value);
          const hasWhitespace = /\s/.test(value);
          const lengthValid = value.length >= 10 && value.length <= 16;
          const typeCount = [hasLower, hasUpper, hasDigit, hasSpecial].filter(Boolean).length;

          if (!lengthValid) return "비밀번호는 10~16자여야 합니다.";
          if (hasWhitespace) return "공백은 사용할 수 없습니다.";
          if (typeCount < 2) return "영문 대소문자, 숫자, 특수문자 중 2가지 이상 조합이어야 합니다.";
          return "";
        }

        function resetIfInvalid(input, message) {
          const msgEl = createMessageEl(input);
          msgEl.textContent = message;
          input.value = "";
        }

        newInput?.addEventListener("input", () => {
          const msgEl = createMessageEl(newInput);
          const errMsg = validateNewPassword(newInput.value);
          msgEl.textContent = errMsg;
        });

        confirmInput?.addEventListener("input", () => {
          const msgEl = createMessageEl(confirmInput);
          msgEl.textContent = newInput.value !== confirmInput.value ? "비밀번호가 일치하지 않습니다." : "";
        });

        passwordForm?.addEventListener("submit", function (e) {
          const newPw = newInput.value;
          const curPw = currentInput.value;
          const confirmPw = confirmInput.value;

          let hasError = false;

          if (!curPw || !newPw || !confirmPw) {
            alert("모든 항목을 입력해주세요.");
            e.preventDefault();
            return;
          }

          const newPwError = validateNewPassword(newPw);
          if (newPwError) {
            resetIfInvalid(newInput, newPwError);
            resetIfInvalid(confirmInput, "새 비밀번호를 다시 입력해주세요.");
            hasError = true;
          }

          if (curPㄹw === newPw) {
            resetIfInvalid(newInput, "기존 비밀번호와 동일합니다.");
            resetIfInvalid(confirmInput, "새 비밀번호를 다시 입력해주세요.");
            hasError = true;
          }

          if (newPw !== confirmPw) {
            resetIfInvalid(confirmInput, "비밀번호가 일치하지 않습니다.");
            hasError = true;
          }

          if (hasError) {
            e.preventDefault();
          }
        });

        // 탭 전환 처리
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        tabBtns.forEach((btn) => {
          btn.addEventListener('click', function () {
            const targetTab = this.getAttribute('data-tab');
            tabBtns.forEach((b) => {
              b.classList.remove('border-gray-800', 'text-gray-800');
              b.classList.add('border-transparent', 'text-gray-500');
            });
            this.classList.remove('border-transparent', 'text-gray-500');
            this.classList.add('border-gray-800', 'text-gray-800');
            tabContents.forEach((content) => content.classList.add('hidden'));
            document.getElementById(targetTab)?.classList.remove('hidden');
          });
        });

        // 탈퇴 확인
        Array.from(document.querySelectorAll('button'))
                .find((button) => button.textContent.includes('탈퇴하기'))
                ?.addEventListener('click', function () {
                  if (confirm('정말로 회원 탈퇴를 하시겠습니까?\n탈퇴 시 모든 데이터가 삭제되며 복구할 수 없습니다.')) {
                    alert('회원 탈퇴가 처리되었습니다.');
                  }
                });
      });
    </script>

    <!-- 서버 결과로 탭 전환 (Thymeleaf용) -->
    <script th:inline="javascript">
      /*<![CDATA[*/
      const result = /*[[${result}]]*/ null;
      if (result === false) {
        alert("현재 비밀번호가 일치하지 않습니다");
        document.querySelector('[data-tab="password"]')?.click();
      }
      /*]]>*/
    </script>

  </body>
</html>
