<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head}">
    <title>공지사항 - Rêve</title>
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="pt-20">
      <div class="min-h-screen bg-gray-50 py-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
          <!-- Page Title -->
          <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">쿠폰</h1>
          </div>
          <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
              <div class="grid grid-cols-12 gap-4 text-sm font-medium text-gray-700">
                <div class="col-span-1 text-center">번호</div>
                <div class="col-span-1 text-center">분류</div>
                <div class="col-span-6">제목</div>
                <div class="col-span-4 text-center">만료일</div>
              </div>
            </div>
            <!--쿠폰 리스트 시작 -->
            <div th:each="coupon : ${couponList}">
              <div th:if="${!coupon.isUsed
                && !coupon.validFrom.isAfter(#temporals.createNow.toLocalDate)
                && coupon.expiresAt.isAfter(#temporals.createNow)}">
                <div class="px-6 py-4">
                  <div class="grid grid-cols-12 gap-4 items-center">
                    <div class="col-span-1 text-center text-sm text-gray-600">번호</div>
                    <div class="col-span-1 text-center">
                      <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800" th:text="${coupon.couponName}"></span>
                    </div>
                    <div class="col-span-6">
                      <span class="text-gray-800 hover:text-gray-600" th:if="${coupon.couponName.name == 'BirthDay'}">🎂 생일 축하드립니다</span>
                      <span class="text-gray-800 hover:text-gray-600" th:if="${coupon.couponName.name == 'NewMember'}">🎉 신규 가입 감사합니다</span>
                    </div>
                    <div class="col-span-4 text-center text-sm text-gray-600" th:text="${#temporals.format(coupon.validFrom, 'yyyy-MM-dd') + ' ~ ' + #temporals.format(coupon.expiresAt, 'yyyy-MM-dd')}"></div>
                  </div>
                </div>
              </div>
            </div>
            <!--쿠폰 리스트 끝 -->
          </div>

          <!-- Quick Links -->
          <div class="mt-8 bg-white rounded-lg shadow-sm p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">빠른 링크</h3>
            <div class="grid md:grid-cols-3 gap-4">
              <a href="/board/qna/list" class="flex items-center p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors">
                <i class="fas fa-question-circle text-blue-500 mr-3"></i>
                <div>
                  <p class="font-medium text-gray-800">자주 묻는 질문</p>
                  <p class="text-sm text-gray-600">FAQ에서 답변을 찾아보세요</p>
                </div>
              </a>
              <a href="/info/policy" class="flex items-center p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors">
                <i class="fas fa-shield-alt text-green-500 mr-3"></i>
                <div>
                  <p class="font-medium text-gray-800">개인정보처리방침</p>
                  <p class="text-sm text-gray-600">개인정보 보호 정책을 확인하세요</p>
                </div>
              </a>
              <a href="/info/terms" class="flex items-center p-3 border border-gray-200 rounded-md hover:bg-gray-50 transition-colors">
                <i class="fas fa-file-contract text-purple-500 mr-3"></i>
                <div>
                  <p class="font-medium text-gray-800">이용약관</p>
                  <p class="text-sm text-gray-600">서비스 이용 약관을 확인하세요</p>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>


    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Login Modal Fragment -->
    <div th:replace="~{fragments/modal :: loginModal}"></div>

    <script src="/js/script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const filterSelect = document.querySelector("select");
        const couponItems = document.querySelectorAll(".coupon-item");

        filterSelect.addEventListener("change", function () {
          const selected = this.value;

          couponItems.forEach((item) => {
            const categoryText = item.querySelector(".coupon-category").textContent.trim();

            if (selected === "최신순" || selected === categoryText) {
              item.style.display = "";
            } else {
              item.style.display = "none";
            }
          });
        });
      });
    </script>
  </body>
</html>
