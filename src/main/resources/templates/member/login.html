<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: head(title='로그인 | Rêve')}">
  </head>
  <body class="font-sans text-gray-800">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content -->
    <main class="pt-20">
      <div class="min-h-screen bg-gray-50 py-12">
        <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
          <!-- Page Title -->
          <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">로그인</h1>
            <p class="text-gray-600">Rêve에 오신 것을 환영합니다</p>
            <div th:if="${param.error}" class="mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
              <strong class="font-bold">로그인이 필요한 페이지입니다.</strong>
            </div>
          </div>

          <!-- Login Form -->
          <div class="bg-white rounded-lg shadow-sm p-8">
            <form th:action="@{/member/login}" method="post" class="space-y-6">
              <!-- Username -->
              <div class="mb-4">
                <label
                  for="loginId"
                  class="block text-sm font-medium text-gray-700 mb-2"
                >
                  아이디
                </label>
                <input
                  type="text"
                  id="loginId"
                  name="loginId"
                  required
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                  placeholder="아이디를 입력하세요"
                />
              </div>

              <!-- Password -->
              <div class="mb-4">
                <label
                  for="password"
                  class="block text-sm font-medium text-gray-700 mb-2"
                >
                  비밀번호
                </label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-gray-800 focus:border-transparent"
                  placeholder="비밀번호를 입력하세요"
                />
              </div>

              <!-- Submit Button -->
              <div class="pt-6 flex space-x-4">
                <button
                  type="button"
                  onclick="history.back()"
                  class="w-full bg-gray-200 text-gray-800 py-3 px-6 rounded-md hover:bg-gray-300 transition-colors font-medium text-lg"
                >
                  목록으로
                </button>
                <button
                  type="submit"
                  class="w-full bg-gray-800 text-white py-3 px-6 rounded-md hover:bg-gray-700 transition-colors font-medium text-lg"
                >
                  로그인
                </button>
              </div>
            </form>

            <!-- Links -->
            <div class="text-center mt-6">
              <a href="/member/signup" class="text-sm text-gray-600 hover:underline"
                >회원가입</a
              >
              <span class="mx-2 text-gray-400">|</span>
              <a href="#" class="text-sm text-gray-600 hover:underline"
                >아이디/비밀번호 찾기</a
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Login Modal Fragment -->
    <div th:replace="~{fragments/modal :: loginModal}"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
